[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plantcare"
version = "0.1.0"
description = "Riconoscimento visivo di piante agrarie, malattie, insetti utili/dannosi e carenze nutrizionali"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Pesi fissati a versioni note: aggiornare solo dopo test sul dataset di validazione.
train = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
