[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plantcare"
version = "0.2.0"
description = "Riconoscimento visivo di piante agrarie, malattie, insetti utili/dannosi e carenze nutrizionali"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Addestramento e inferenza
train = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0"]
# Interfaccia web
serve = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27", "plantcare[train,serve]"]

[project.scripts]
plantcare = "plantcare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
