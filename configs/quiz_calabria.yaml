  - {taxon: "Zeuzera pyrina", nome: "Rodilegno giallo", gruppo: olivo}
  - {taxon: "Ceratitis capitata", nome: "Mosca mediterranea della frutta", gruppo: agrumi}
  - {taxon: "Phyllocnistis citrella", nome: "Minatrice serpentina degli agrumi", gruppo: agrumi}
  - {taxon: "Aleurothrixus floccosus", nome: "Aleurodide fioccoso degli agrumi", gruppo: agrumi}
  - {taxon: "Aleurocanthus spiniferus", nome: "Aleurodide spinoso degli agrumi", gruppo: agrumi}
  - {taxon: "Planococcus citri", nome: "Cotonello degli agrumi", gruppo: agrumi}
