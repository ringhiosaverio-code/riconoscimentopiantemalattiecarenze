malattie:
  - {taxon: "Venturia oleaginea", nome: "Occhio di pavone dell'olivo", gruppo: olivo, causa: fungo}
  - {taxon: "Pseudomonas savastanoi", nome: "Rogna (Pseudomonas savastanoi, su olivo e oleandro)", gruppo: olivo, causa: batterio}
  - {taxon: "Plasmopara viticola", nome: "Peronospora della vite", gruppo: vite, causa: fungo}
  - {taxon: "Erysiphe necator", nome: "Oidio della vite", gruppo: vite, causa: fungo}
  - {taxon: "Botrytis cinerea", nome: "Muffa grigia", gruppo: vite, causa: fungo}
  - {taxon: "Phyllosticta ampelicida", nome: "Marciume nero della vite (black rot)", gruppo: vite, causa: fungo}
  - {taxon: "Phytophthora infestans", nome: "Peronospora del pomodoro e della patata", gruppo: pomodoro, causa: fungo}
  - {taxon: "Leveillula taurica", nome: "Oidio delle solanacee", gruppo: pomodoro, causa: fungo}
  - {taxon: "Taphrina deformans", nome: "Bolla del pesco", gruppo: pesco, causa: fungo}
  - {taxon: "Monilinia fructigena", nome: "Monilia (marciume bruno)", gruppo: pesco, causa: fungo}
  - {taxon: "Tranzschelia pruni-spinosae", nome: "Ruggine del susino", gruppo: pesco, causa: fungo}
  - {taxon: "Venturia inaequalis", nome: "Ticchiolatura del melo", gruppo: melo, causa: fungo}
  - {taxon: "Podosphaera leucotricha", nome: "Oidio del melo", gruppo: melo, causa: fungo}
  - {taxon: "Erwinia amylovora", nome: "Colpo di fuoco batterico", gruppo: melo, causa: batterio}
  - {taxon: "Venturia pyrina", nome: "Ticchiolatura del pero", gruppo: melo, causa: fungo}
  - {taxon: "Wilsonomyces carpophilus", nome: "Corineo delle drupacee", gruppo: pesco, causa: fungo}
  - {taxon: "Podosphaera pannosa", nome: "Mal bianco del pesco (e della rosa)", gruppo: pesco, causa: fungo}
  - {taxon: "Uromyces viciae-fabae", nome: "Ruggine della fava", gruppo: fava, causa: fungo}

# Foto iNaturalist per il lettore delle malattie (scripts/import_inat_train.py --malattie): classe nuova
# ("inat:<specie>") o classe già esistente da rafforzare. coltura: solo se l'ospite è certo (la rogna è
# anche su oleandro, la bolla anche su mandorlo, la peronospora su pomodoro e patata).
addestramento_malattie:
  - {taxon: "Venturia oleaginea", classe: "inat:venturia_oleaginea", coltura: olea_europaea}
  - {taxon: "Pseudomonas savastanoi", classe: "inat:pseudomonas_savastanoi", coltura: ""}
  - {taxon: "Erwinia amylovora", classe: "inat:erwinia_amylovora", coltura: ""}
  - {taxon: "Botrytis cinerea", classe: "inat:botrytis_cinerea", coltura: ""}
  - {taxon: "Taphrina deformans", classe: peach_leaf_curl, coltura: ""}
  - {taxon: "Plasmopara viticola", classe: grapevine_downy_mildew, coltura: vitis_vinifera}
  - {taxon: "Phytophthora infestans", classe: tomato_late_blight, coltura: ""}
  # altre colture del Disciplinare (giro del 21/11)
  - {taxon: "Wilsonomyces carpophilus", classe: "inat:wilsonomyces_carpophilus", coltura: ""}
  - {taxon: "Podosphaera pannosa", classe: "inat:podosphaera_pannosa", coltura: ""}
  - {taxon: "Uromyces viciae-fabae", classe: "inat:uromyces_viciae_fabae", coltura: ""}
  - {taxon: "Blumeriella jaapii", classe: cherry_leaf_spot, coltura: prunus_avium}
  - {taxon: "Podosphaera xanthii", classe: zucchini_powdery_mildew, coltura: ""}
  - {taxon: "Puccinia allii", classe: garlic_rust, coltura: ""}
  - {taxon: "Bremia lactucae", classe: lettuce_downy_mildew, coltura: ""}
  - {taxon: "Monilinia laxa", classe: apple_brown_rot, coltura: ""}
