# Foto per il quiz da iNaturalist (osservazioni "research grade", licenze CC0, CC BY, CC BY-NC con
# attribuzione dell'autore): colture, insetti e malattie presenti nelle norme di difesa integrata
# della Regione Calabria 2026 (configs/difesa/disciplinare_calabria_2026.json).
# taxon: nome usato da iNaturalist; nome: nome italiano mostrato nel quiz; gruppo: coltura a cui
# appartiene la domanda (le risposte sbagliate si scelgono nello stesso gruppo).
# coltura_plant: etichetta del lettore della coltura, se esiste. Le colture sono quelle del
# Disciplinare o del lettore della coltura (fico d'India); il cedro rientra negli agrumi. Arancio dolce e
# bergamotto mancano: iNaturalist li unisce ad altri agrumi (Citrus × aurantium, Citrus × limon).

colture:
  - {taxon: "Olea europaea", nome: "Olivo", coltura_plant: olea_europaea}
  - {taxon: "Citrus limon", nome: "Limone", coltura_plant: citrus_limon}
  - {taxon: "Citrus reticulata", nome: "Mandarino e clementino", coltura_plant: citrus_reticulata}
  - {taxon: "Citrus medica", nome: "Cedro"}
  - {taxon: "Ficus carica", nome: "Fico"}
  - {taxon: "Opuntia ficus-indica", nome: "Fico d'India", coltura_plant: opuntia_ficus_indica}
  - {taxon: "Prunus dulcis", nome: "Mandorlo"}
  - {taxon: "Corylus avellana", nome: "Nocciolo", coltura_plant: corylus_avellana}
  - {taxon: "Punica granatum", nome: "Melograno"}
  - {taxon: "Actinidia deliciosa", nome: "Actinidia (kiwi)", coltura_plant: actinidia_chinensis}
  - {taxon: "Pyrus communis", nome: "Pero", coltura_plant: pyrus_communis}
  - {taxon: "Malus domestica", nome: "Melo", coltura_plant: malus_domestica}
  - {taxon: "Prunus persica", nome: "Pesco", coltura_plant: prunus_persica}
  - {taxon: "Prunus armeniaca", nome: "Albicocco"}
  - {taxon: "Prunus avium", nome: "Ciliegio", coltura_plant: prunus_avium}
  - {taxon: "Prunus domestica", nome: "Susino"}
  - {taxon: "Vitis vinifera", nome: "Vite", coltura_plant: vitis_vinifera}
  - {taxon: "Cynara cardunculus", nome: "Carciofo", coltura_plant: cynara_cardunculus}
  - {taxon: "Vicia faba", nome: "Fava"}
  - {taxon: "Foeniculum vulgare", nome: "Finocchio"}

