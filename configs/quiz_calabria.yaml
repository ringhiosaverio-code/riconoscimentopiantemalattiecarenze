# Foto per il quiz da iNaturalist (osservazioni "research grade", licenze CC0, CC BY, CC BY-NC con
# attribuzione dell'autore): colture, insetti e malattie presenti nelle norme di difesa integrata
# della Regione Calabria 2026 (configs/difesa/disciplinare_calabria_2026.json).
# taxon: nome usato da iNaturalist; nome: nome italiano mostrato nel quiz; gruppo: coltura a cui
# appartiene la domanda (le risposte sbagliate si scelgono nello stesso gruppo).
# coltura_plant: etichetta del lettore della coltura, se esiste. Le colture sono quelle del
# Disciplinare o del lettore della coltura (fico d'India); il cedro rientra negli agrumi. Arancio dolce e
# bergamotto mancano: iNaturalist li unisce ad altri agrumi (Citrus × aurantium, Citrus × limon).

