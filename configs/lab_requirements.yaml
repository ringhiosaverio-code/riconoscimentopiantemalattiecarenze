    tipo: eppo
    lista_eppo: "A1 (organismo assente dalla regione EPPO, raccomandato come organismo da quarantena)"
    classi: {disease: ["agml_brinjalfruit:Shoot and Fruit Borer"]}
  - eppo: EUTEBA
    organismo: "Eutetranychus banksi (acaro texano degli agrumi)"
    ue: "Nessuna voce UE sulla scheda EPPO"
    tipo: eppo
    lista_eppo: "Lista di allerta (dal 2024)"
    classi: {disease: ["agml_citrusuat:Texas_mite"]}
