    tipo: quarantena
    lista_eppo: "A2"
    classi: {disease: ["inat:xylella_fastidiosa"]}
    analisi: "Campioni di rametti e foglie analizzati in laboratorio ufficiale: test sierologici (ELISA) o molecolari (PCR real-time); si considera rilevata con almeno due test positivi basati su principi diversi (PM 7/24)."
    fonti: [eppo_pm7_024]
  - eppo: DEUTTR
    organismo: "Plenodomus tracheiphilus (mal secco degli agrumi)"
