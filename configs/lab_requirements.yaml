  - eppo: TYLCV0
    organismo: "Tomato yellow leaf curl virus"
    ue: "Organismo regolamentato non da quarantena (RNQP, Allegato IV)"
    tipo: rnqp
    lista_eppo: "A2"
    classi: {disease: ["tomato_yellow_leaf_curl"]}
  - eppo: FUSAC4
    organismo: "Fusarium oxysporum f. sp. cubense razza tropicale 4 (malattia di Panama del banano)"
