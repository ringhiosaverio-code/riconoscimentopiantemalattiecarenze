  - eppo: TOXOCI
    organismo: "Toxoptera citricida (Aphis citricidus, afide bruno degli agrumi)"
    ue: "Organismo da quarantena UE, Reg. (UE) 2019/2072 Allegato II B (presente in parte dell'UE)"
    tipo: quarantena
    lista_eppo: "A2"
    classi: {pest: ["ip102_090"]}
  - eppo: ERWIAM
