# Causa di ogni classe del lettore delle malattie. L'app somma le probabilità delle classi con la
# stessa causa: "sintomi causati da insetti" vale la somma di tutte le classi di danno da insetti,
# così la causa è più affidabile della singola classe (due danni da insetti simili tra loro non si
# tolgono probabilità a vicenda).
# Per le classi della tassonomia la causa deriva da pathogen_type (insect_induced diviso tra
# insetto e acaro qui sotto); le etichette dei dataset sono elencate tutte.
causes:
  fungo: "Fungo o oomicete"
  batterio: "Batterio o fitoplasma"
  virus: "Virus"
  viroide: "Viroide"
  insetto: "Insetti"
  acaro: "Acari"
  nematode: "Nematodi"
  abiotico: "Causa abiotica (sole, gelo, siccità, fitotossicità)"
  nutrizionale: "Disturbo nutrizionale"
  sano: "Nessun sintomo"
  non_specificato: "Causa non specificata dal dataset"

labels:
  # tassonomia
  healthy: sano
  disturbo_nutrizionale: nutrizionale
  tomato_leafminer_damage: insetto
  # PlantVillage
  Apple___Black_rot: fungo
  Apple___Cedar_apple_rust: fungo
  Cherry_(including_sour)___Powdery_mildew: fungo
