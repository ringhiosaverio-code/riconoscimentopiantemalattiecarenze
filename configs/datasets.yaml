# Configurazione dei dataset per `plantcare build-manifest`.
#
# Layout atteso (vedi docs/dataset.md):
#   data/raw/plantvillage/   cartelle "Coltura___Malattia" (es. raw/color/ del repo spMohanty)
#   data/raw/ip102/          images/ + train.txt, val.txt, test.txt (split ufficiali)
#
# I dataset NON sono inclusi nel repository (licenze e dimensioni). Vanno scaricati
# dalle fonti ufficiali e registrati in data/SOURCES.md.

data_root: data/raw
manifest: data/processed/manifest.csv
seed: 42

# IP102: nome della cartella con le immagini, dentro data_root/ip102
ip102_images_dir: images
# Base degli indici nei file train/val/test.txt di IP102: 0 o 1.
# Verificare sul file scaricato (il minimo valore presente); classes.txt è 1-based.
ip102_label_base: 0

# PlantVillage: la mappa dei gruppi foglia è letta da data/raw/plantvillage/leaf_grouping/
# se presente, altrimenti da metadata/plantvillage/leaf-map.json (versione nel repository).
