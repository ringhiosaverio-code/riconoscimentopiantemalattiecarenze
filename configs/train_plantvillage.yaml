# Addestramento PlantVillage (38 classi): coltura e malattia.
# EfficientNet-B0 pre-addestrata su ImageNet (timm, pesi da Hugging Face).
manifest: data/processed/manifest.csv
data_root: data/raw
output_dir: models/plantvillage_effb0

backbone: efficientnet_b0
pretrained: true
image_size: 160
dropout: 0.2

heads: [plant, disease]
head_weights: {plant: 0.5, disease: 1.0}

epochs: 6
batch_size: 64
lr: 5.0e-4
weight_decay: 1.0e-4
num_workers: 2
seed: 42
device: cpu
