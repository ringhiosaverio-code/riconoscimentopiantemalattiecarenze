# Dataset di immagini esterni usati per l'addestramento.
# Ogni voce: repository Hugging Face, file da scaricare, licenza, citazione, uso nel modello.
# I file vanno in data/external/<name>/ (non versionati).
#
# NOTA LICENZE: la licenza indicata è quella dichiarata dalla fonte originale.
# Se un mirror dichiara una licenza diversa da quella originale, vale l'originale.

datasets:

  - name: ip102
    repo: EnmmmmOvO/insect-pest-dataset
    files: ["data/*.parquet"]
    use: pest
    license: "Uso accademico (IP102 originale). Il mirror dichiara MIT, ma vale la licenza dell'autore: per uso commerciale serve il permesso."
    citation: "Wu X. et al. (2019) IP102: A Large-Scale Benchmark Dataset for Insect Pest Recognition. CVPR 2019, pp. 8787-8796. DOI 10.1109/CVPR.2019.00899"
    note: "Mirror con gli stessi split ufficiali (45.095 / 7.508 / 22.619 immagini)."

  - name: plantdoc
    repo: agyaatcoder/PlantDoc
    files: ["data/*.parquet"]
    use: disease_field
    license: "CC BY 4.0"
    citation: "Singh D. et al. (2020) PlantDoc: A Dataset for Visual Plant Disease Detection. CoDS-COMAD 2020, pp. 249-253. DOI 10.1145/3371158.3371196"
    note: "Foto di campo con riquadri: le lesioni vengono ritagliate come immagini di classificazione."

  - name: agml_lemon
    repo: Project-AgML/lemon_leaf_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: citrus_limon
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"

  - name: agml_eggplant
    repo: Project-AgML/eggplant_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: solanum_melongena
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"
    note: "Tutti i 6 file originali: i primi due contengono solo foglie sane."

  - name: agml_tom2024
    repo: Project-AgML/TOM2024_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: solanum_lycopersicum
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"

  - name: agml_onion
    repo: Project-AgML/COLD_onion_leaf_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: allium_cepa_tropea
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"
    note: "Cipolla generica: usata come riferimento per la cipolla di Tropea, che non ha un dataset dedicato."

  - name: agml_chili
    repo: Project-AgML/COLD_chili_leaf_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: capsicum_annuum_peperoncino
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"
    note: "Peperoncino generico: usato come riferimento per il peperoncino calabrese."

  - name: agml_grape
    repo: Project-AgML/grape_leaf_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: vitis_vinifera
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"

  - name: agml_banana
    repo: Project-AgML/banana_leaf_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: musa_spp
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"

  - name: agml_tuta
    repo: Project-AgML/tuta_absoluta_tomato_leaf_classification
    files: ["data/*.parquet"]
    use: disease
    crop: solanum_lycopersicum
    license: "MIT"
    citation: "Shehu H.A. et al. (2025) Early detection of tomato leaf diseases using transformers and transfer learning. European Journal of Agronomy 168:127625"

  - name: agml_potato
    repo: Project-AgML/potato_leaf_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: solanum_tuberosum
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"

  - name: agml_cauliflower
    repo: Project-AgML/cauliflower_leaf_disease_classification
    files: ["data/train-00000-of-00011.parquet"]
    use: disease
    crop: brassica_oleracea_italica
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"
    note: "Cavolfiore: brassica affine al broccolo, usata come riferimento. Solo 1 file su 11."

  - name: inatag_crops
    repo: Project-AgML/iNatAg-mini
    files:
      - olea_europaea.zip
      - vitis_vinifera.zip
      - citrus_limon.zip
      - citrus_reticulata.zip
      - citrus_sinensis.zip
      - actinidia_chinensis.zip
      - allium_cepa.zip
      - allium_sativum.zip
      - annona_cherimola.zip
      - capsicum_annuum.zip
      - corylus_avellana.zip
      - cucumis_sativus.zip
      - cucurbita_pepo.zip
      - cynara_cardunculus.zip
      - cynara_scolymus.zip
      - fragaria_ananassa.zip
      - malus_domestica.zip
      - musa_acuminata.zip
      - opuntia_ficus-indica.zip
      - persea_americana.zip
      - prunus_avium.zip
      - prunus_persica.zip
      - pyrus_communis.zip
      - solanum_melongena.zip
      - solanum_tuberosum.zip
      - triticum_aestivum.zip
      - triticum_durum.zip
      - zea_mays.zip
    use: plant
    license: "Apache-2.0 (dataset); le singole foto iNaturalist hanno licenze Creative Commons dei loro autori"
    citation: "iNatAg (Project-AgML, UC Davis), derivato da iNaturalist"
    note: "Foto di piante intere e parti in condizioni reali, per il lettore della coltura."
  # --- aggiunte per distinguere malattie simili del melo e i danni da insetti e acari ---
  - name: agml_appleleaf9
    repo: Project-AgML/appleleaf9_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: malus_domestica
    license: "CC BY 4.0"
    citation: "Yang Q., Duan S., Wang L. (2022) Efficient Identification of Apple Leaf Diseases in the Wild Using Convolutional Neural Networks. Agronomy 12, 2784. DOI 10.3390/agronomy12112784"
    note: "Ticchiolatura, ruggine, alternaria, maculatura a occhio di rana, oidio, mosaico. Contiene anche foto PlantVillage: i duplicati vengono rimossi all'importazione."
  - name: agml_citrusuat
    repo: Project-AgML/citrusuat_disease_classification
    files: ["data/*.parquet"]
    use: disease, deficiency
    crop: citrus_sinensis
    license: "CC BY 4.0"
    citation: "Gómez-Flores W., Garza-Saldaña J.J., Varela-Fuentes S.E. (2024) CitrusUAT: A dataset of orange Citrus sinensis leaves for abnormality detection using image analysis techniques. Data in Brief 52, 109908. DOI 10.1016/j.dib.2023.109908"
    note: "Minatrice serpentina, cocciniglia rossa, acaro, macchia grassa, HLB e carenze di Fe, Mg, Mn, N, Zn."
  - name: agml_plum
    repo: Project-AgML/plum_leaf_fruit_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: prunus_domestica
    license: "CC BY 4.0"
    citation: "Nayeem R.A. et al. (2025) A comprehensive image dataset of Plum leaf and fruit for disease classification. Data in Brief 60, 111625. DOI 10.17632/w7sdx55m7z.1 (dati)"
    note: "Solo la versione non aumentata; usate solo le classi con diagnosi chiara (fori da insetti, sano)."
  - name: agml_pomegranate
    repo: Project-AgML/pomegranate_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: punica_granatum
    license: "CC BY 4.0"
    citation: "Mohammed B.A. et al. (2025) Pomegranate disease detection and classification dataset for deep learning applications: A case study from Halabja city. Data in Brief, 112298. DOI 10.5281/zenodo.15856012 (dati)"
    note: "Frutti: antracnosi (Colletotrichum), tignola del carrubo (Ectomyelois ceratoniae), scottature."
  - name: agml_fig
    repo: Project-AgML/fig_leaf_ficus_worm_classification
    files: ["data/*.parquet"]
    use: disease
    crop: ficus_carica
    license: "CC BY 4.0"
    citation: "Hafi S.J. et al. (2024) Image dataset of healthy and infected fig leaves with Ficus leaf worm. Data in Brief 53, 109958. DOI 10.17632/f7dk2yknff.2 (dati)"
    note: "Foglie di fico sane e con danni della tignola delle foglie del fico."
  - name: agml_citrusfruit
    repo: Project-AgML/citrus_fruit_leaf_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: citrus_sinensis
    license: "CC BY 4.0"
    citation: "Rauf H.T. et al. (2019) A citrus fruits and leaves dataset for detection and classification of citrus diseases through machine learning. Data in Brief 26, 104340. DOI 10.1016/j.dib.2019.104340"
    note: "Frutti e foglie di agrumi: macchia nera, cancro batterico, greening, melanosi, ticchiolatura (parte della pianta indicata nel dataset)."
  - name: agml_potatoblight
    repo: Project-AgML/potato_leaf_blight_classification
    files: ["potato_leaf_blight.zip"]
    use: disease
    crop: solanum_tuberosum
    license: "CC BY 4.0"
    citation: "Laizer H., Mduma N. et al. (2025) Irish potato imagery dataset for detection of early and late blight diseases. Data in Brief. Dati: Zenodo DOI 10.5281/zenodo.8286529"
    note: "Foto di campo (Tanzania) di alternariosi e peronospora della patata; importato un campione per classe."
  - name: agml_brinjalfruit
    repo: Project-AgML/BrinjalFruitX_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: solanum_melongena
    license: "CC BY 4.0"
    citation: "Bitto A.K., Hasan M.Z., Bijoy M.H.I. et al. (2026) BrinjalFruitX: A Field-Collected Image Dataset for Machine Learning and Deep Learning-Based Disease Identification in Brinjal Fruits. Data in Brief. Dati: Mendeley DOI 10.17632/ngc58fsxgd.1"
    note: "Frutti di melanzana: Phomopsis, marciume molle, spaccature, piralide dei germogli e dei frutti."
  - name: agml_vegleaf
    repo: Project-AgML/plant_leaf_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: solanum_lycopersicum
    license: "CC BY 4.0"
    citation: "Hasan M. et al. (2024) Comprehensive smartphone image dataset for plant leaf disease detection and freshness assessment from Bangladesh vegetable fields. Data in Brief. Dati: Mendeley DOI 10.17632/n67gctmjyj.3"
    note: "Foglie di pomodoro, melanzana, cetriolo e cavolfiore in campo (zucca amara e zucca da vino escluse: non in tassonomia)."
  # --- foto di campo per le malattie ---
  - name: plantwild
    repo: uqtwei2/PlantWild
    files: ["plantwild_v2.zip"]
    use: disease
    license: "CC BY-NC-ND 4.0: solo uso non commerciale (progetto accademico); usato solo per l'addestramento, non ripubblicato nel quiz"
    citation: "Wei T., Chen Z., Huang Z., Yu X. (2024) Benchmarking In-the-wild Multimodal Disease Recognition and A Versatile Baseline. ACM Multimedia 2024 (PlantWild v2, revisione di esperti)"
    note: "Foto di malattie 'in natura' (più foglie, sfondo e luce variabili). Le copie delle foto di PlantDoc vengono escluse."
  - name: agml_ccmt
    repo: Project-AgML/crop_pest_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: solanum_lycopersicum
    license: "CC BY 4.0"
    citation: "Mensah P.K. et al. (2023) CCMT: Dataset for crop pest and disease detection. Data in Brief 49, 109306"
    note: "Foto di campo (Ghana) di pomodoro e mais, anche con danni da insetti; anacardio e manioca esclusi (non in tassonomia)."
  - name: agml_pepperfield
    repo: Project-AgML/pepper_disease_pest_classification
    files: ["data/*.parquet"]
    use: disease
    crop: malus_domestica
    license: "CC BY 4.0"
    citation: "Wang X., Liu J., Chen Q. (2025) An advanced deep learning method for pepper diseases and pests detection. Plant Methods 21. Dati: Mendeley DOI 10.17632/tg3z7xxkdb.1"
    note: "Nonostante il nome, le foto sono foglie di MELO in campo con le classi di ATLDSD (alternaria, maculatura bruna, maculatura grigia, mosaico, ruggine): verificato sulle immagini e con 3.082 copie quasi identiche in AppleLeaf9. Importate come melo con le etichette di AppleLeaf9; le classi ATLDSD di AppleLeaf9 sono escluse per non avere copie tra addestramento e test. Campione di 1.500 foto per classe, split per blocchi di 50 scatti consecutivi."

  # --- giro del 25/11: agrumi e cucurbitacee ---
  - name: agml_orange
    repo: Project-AgML/orange_leaf_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: citrus_sinensis
    license: "CC BY 4.0 (Data in Brief, dati su Mendeley Data)"
    citation: "Emon Y.R., Ahad M.T., Rabbany G. (2024) Multi-format open-source sweet orange leaf dataset for disease detection, classification, and analysis. Data in Brief 55, 110713"
    note: "Foglie di arancio dolce: cancro batterico, HLB (anche 'yellow dragon'), cotonello, aleurodide spinoso, disseccamento, oidio, impallinatura, foglie danneggiate o gialle."
  - name: agml_cucumber
    repo: Project-AgML/cucumber_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: cucumis_sativus
    license: "CC BY 4.0 (Data in Brief, dati su Mendeley Data)"
    citation: "Sultana N., Shorif S.B., Akter M., Uddin M.S. (2023) A dataset for successful recognition of cucumber diseases. Data in Brief 49, 109320"
    note: "Foglie e frutti di cetriolo: antracnosi, avvizzimento batterico, marciumi del frutto, peronospora, cancro gommoso. Campione di 500 foto per classe."
  - name: agml_watermelon
    repo: Project-AgML/watermelon_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: ""
    license: "CC BY 4.0"
    citation: "Watermelon disease classification (Project-AgML, Hugging Face), solo le foto originali (config 'raw')"
    note: "Foglie di anguria: antracnosi, peronospora, mosaico; coltura non nel lettore delle colture (lasciata vuota)."

  # --- foto di campo per le malattie dal web (PlantSeg) ---
  - name: plantseg
    repo: LFTTim/plantseg_disease_segmentation
    files: ["data/*.parquet"]
    use: disease
    license: "CC BY-NC-ND 4.0: solo uso non commerciale (progetto accademico); usato solo per l'addestramento, non ripubblicato nel quiz"
    citation: "Wei T., Chen Z., Yu X., Chapman S., Melloy P., Huang Z. (2024) PlantSeg: A Large-Scale In-the-wild Dataset for Plant Disease Segmentation. arXiv 2409.04038"
    note: "11.458 foto di malattie raccolte sul web (115 classi, stessi nomi di PlantWild). Verificato il 25/11: per le colture del progetto quasi tutte sono copie di foto di PlantWild (distanza dHash mediana 0) e vengono escluse; restano 13 foto nuove. Split originale."

  # --- pero in campo (Italia) e virus della vite ---
  - name: diamos
    use: disease
    crop: pyrus_communis
    license: "CC BY 4.0"
    citation: "Fenu G., Malloci F.M. (2021) DiaMOS Plant: A Dataset for Diagnosis and Monitoring Plant Disease. Agronomy 11, 2107. Dati: Zenodo 5557313"
    note: "Foglie di pero fotografate in campo in Sardegna: limacina del pero, maculature, foglie sane (accartocciamento escluso: causa non indicata). Zip di 13 GB letto a pezzi (scripts/import_diamos.py), campione di 500 + 600 + 44 foto ridotte a 512 px; split per blocchi di scatti consecutivi."
  - name: vinevirus
    repo: Project-AgML/vine_virus_photo_dataset
    use: disease
    crop: vitis_vinifera
    license: "CC BY 4.0"
    citation: "MacDonald S.L. et al. (2025) Leveraging Artificial Intelligence to Develop a Decision Support Tool for Visual Symptom Assessment of Grapevine Leafroll and Red Blotch Diseases. Plant Disease"
    note: "Viti in vigneto (California) con lo stato virale verificato in laboratorio: accartocciamento fogliare (GLRaV-3, unito alla classe di PlantWild) e viti senza virus; red blotch escluso. Scaricato un pezzo alla volta (scripts/import_vinevirus.py), al massimo 600 + 400 foto."
  - name: letteratura
    use: disease
    license: "Foto protette da diritto d'autore o 'solo uso didattico' (EPPO): solo addestramento per ricerca (art. 70-ter L. 633/1941), mai ripubblicate"
    citation: "configs/foto_letteratura.yaml (fonte per foto)"
    note: "Poche foto di sintomi scelte a vista da PDF e dall'EPPO Global Database per malattie senza altre fonti aperte: mal secco degli agrumi (classe nuova), cancro batterico dell'actinidia, rogna e lebbra dell'olivo. Tutte nell'addestramento: nessuna prova indipendente."

  # --- giro "Sud Italia" (25/11 notte) ---
  - name: bugwood
    use: disease, pest
    license: "Bugwood Images: uso non commerciale con citazione (CC BY-NC 3.0 US; alcune CC BY 3.0 US). Solo addestramento"
    citation: "Bugwood Images, Center for Invasive Species and Ecosystem Health, University of Georgia (www.ipmimages.org); autore per foto nel manifest"
    note: "Soggetti di configs/bugwood.yaml e insetti di configs/quiz_calabria.yaml; solo foto di campo (niente piastre, microscopio, disegni); split per autore."
  - name: observation
    use: disease, pest
    license: "CC BY-NC 4.0 o CC BY-NC-ND 4.0 (per foto). Solo addestramento"
    citation: "Observation.org, Nature data from around the World, tramite GBIF (dataset 8a863029-f435-446a-821e-275f4f641165)"
    note: "Solo identificazioni approvate, prima dai paesi mediterranei; al massimo 300 foto per specie e 10 per autore; split per autore."
  - name: emiliaromagna
    use: disease, pest
    license: "Diritto d'autore della Regione Emilia-Romagna: solo addestramento per ricerca (art. 70-ter L. 633/1941)"
    citation: "Regione Emilia-Romagna, Servizio fitosanitario, schede delle avversità (agricoltura.regione.emilia-romagna.it)"
    note: "Foto delle schede che corrispondono a classi dei lettori (scripts/import_emiliaromagna.py); tutte nell'addestramento."

  # --- insetti e acari della Calabria (lettore degli insetti) ---
  - name: inat_calabria
    use: pest
    license: "CC0, CC BY o CC BY-NC (per foto, autore salvato): uso non commerciale e accademico"
    citation: "iNaturalist (www.inaturalist.org), osservazioni 'research grade'; specie delle norme di difesa integrata della Regione Calabria 2026 (configs/quiz_calabria.yaml)"
    note: "Scaricate con scripts/import_inat_train.py, al massimo 200 foto per specie e 5 per autore; split per autore (10% test, 10% validazione). Le foto restano fuori dal repository."

  # --- vite in campo, mal dell'esca ---
  - name: fieldvitis
    use: disease
    crop: vitis_vinifera
    license: "CC BY 4.0 (record Zenodo); raccoglie foto di ESCA-dataset, PlantDoc e Grape Disease"
    citation: "FieldVitis, Zenodo record 17307846 (https://zenodo.org/records/17307846)"
    note: "Foglie di vite in campo: mal dell'esca (200), sane, Isariopsis, black rot. Escluse 20 copie di foto di PlantDoc (il test di PlantDoc resta pulito). Usato solo per l'addestramento, non nel quiz: le licenze delle fonti originali non sono tutte chiare."
