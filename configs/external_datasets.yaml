# Dataset di immagini esterni usati per l'addestramento.
# Ogni voce: repository Hugging Face, file da scaricare, licenza, citazione, uso nel modello.
# I file vanno in data/external/<name>/ (non versionati).
#
# NOTA LICENZE: la licenza indicata è quella dichiarata dalla fonte originale.
# Se un mirror dichiara una licenza diversa da quella originale, vale l'originale.

datasets:

  - name: ip102
    repo: EnmmmmOvO/insect-pest-dataset
    files: ["data/*.parquet"]
    use: pest
    license: "Uso accademico (IP102 originale). Il mirror dichiara MIT, ma vale la licenza dell'autore: per uso commerciale serve il permesso."
    citation: "Wu X. et al. (2019) IP102: A Large-Scale Benchmark Dataset for Insect Pest Recognition. CVPR 2019, pp. 8787-8796. DOI 10.1109/CVPR.2019.00899"
    note: "Mirror con gli stessi split ufficiali (45.095 / 7.508 / 22.619 immagini)."

  - name: plantdoc
    repo: agyaatcoder/PlantDoc
    files: ["data/*.parquet"]
    use: disease_field
    license: "CC BY 4.0"
    citation: "Singh D. et al. (2020) PlantDoc: A Dataset for Visual Plant Disease Detection. CoDS-COMAD 2020, pp. 249-253. DOI 10.1145/3371158.3371196"
    note: "Foto di campo con riquadri: le lesioni vengono ritagliate come immagini di classificazione."

  - name: agml_lemon
    repo: Project-AgML/lemon_leaf_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: citrus_limon
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"

  - name: agml_eggplant
    repo: Project-AgML/eggplant_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: solanum_melongena
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"
    note: "Tutti i 6 file originali: i primi due contengono solo foglie sane."

  - name: agml_tom2024
    repo: Project-AgML/TOM2024_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: solanum_lycopersicum
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"

  - name: agml_onion
    repo: Project-AgML/COLD_onion_leaf_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: allium_cepa_tropea
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"
    note: "Cipolla generica: usata come riferimento per la cipolla di Tropea, che non ha un dataset dedicato."

  - name: agml_chili
    repo: Project-AgML/COLD_chili_leaf_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: capsicum_annuum_peperoncino
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"
    note: "Peperoncino generico: usato come riferimento per il peperoncino calabrese."

  - name: agml_grape
    repo: Project-AgML/grape_leaf_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: vitis_vinifera
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"

  - name: agml_banana
    repo: Project-AgML/banana_leaf_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: musa_spp
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"

  - name: agml_tuta
    repo: Project-AgML/tuta_absoluta_tomato_leaf_classification
    files: ["data/*.parquet"]
    use: disease
    crop: solanum_lycopersicum
    license: "MIT"
    citation: "Shehu H.A. et al. (2025) Early detection of tomato leaf diseases using transformers and transfer learning. European Journal of Agronomy 168:127625"

  - name: agml_potato
    repo: Project-AgML/potato_leaf_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: solanum_tuberosum
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"

  - name: agml_cauliflower
    repo: Project-AgML/cauliflower_leaf_disease_classification
    files: ["data/train-00000-of-00011.parquet"]
    use: disease
    crop: brassica_oleracea_italica
    license: "CC BY 4.0"
    citation: "Vedi scheda del dataset su Project-AgML (indice AgML, UC Davis)"
    note: "Cavolfiore: brassica affine al broccolo, usata come riferimento. Solo 1 file su 11."

  - name: inatag_crops
    repo: Project-AgML/iNatAg-mini
    files:
      - olea_europaea.zip
      - vitis_vinifera.zip
      - citrus_limon.zip
      - citrus_reticulata.zip
      - citrus_sinensis.zip
      - actinidia_chinensis.zip
      - allium_cepa.zip
      - allium_sativum.zip
      - annona_cherimola.zip
      - capsicum_annuum.zip
      - corylus_avellana.zip
      - cucumis_sativus.zip
      - cucurbita_pepo.zip
      - cynara_cardunculus.zip
      - cynara_scolymus.zip
      - fragaria_ananassa.zip
      - malus_domestica.zip
      - musa_acuminata.zip
      - opuntia_ficus-indica.zip
      - persea_americana.zip
      - prunus_avium.zip
      - prunus_persica.zip
      - pyrus_communis.zip
      - solanum_melongena.zip
      - solanum_tuberosum.zip
      - triticum_aestivum.zip
      - triticum_durum.zip
      - zea_mays.zip
    use: plant
    license: "Apache-2.0 (dataset); le singole foto iNaturalist hanno licenze Creative Commons dei loro autori"
    citation: "iNatAg (Project-AgML, UC Davis), derivato da iNaturalist"
    note: "Foto di piante intere e parti in condizioni reali, per il lettore della coltura."
  # --- aggiunte per distinguere malattie simili del melo e i danni da insetti e acari ---
  - name: agml_appleleaf9
    repo: Project-AgML/appleleaf9_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: malus_domestica
    license: "CC BY 4.0"
    citation: "Yang Q., Duan S., Wang L. (2022) Efficient Identification of Apple Leaf Diseases in the Wild Using Convolutional Neural Networks. Agronomy 12, 2784. DOI 10.3390/agronomy12112784"
    note: "Ticchiolatura, ruggine, alternaria, maculatura a occhio di rana, oidio, mosaico. Contiene anche foto PlantVillage: i duplicati vengono rimossi all'importazione."
  - name: agml_citrusuat
    repo: Project-AgML/citrusuat_disease_classification
    files: ["data/*.parquet"]
    use: disease, deficiency
    crop: citrus_sinensis
    license: "CC BY 4.0"
    citation: "Gómez-Flores W., Garza-Saldaña J.J., Varela-Fuentes S.E. (2024) CitrusUAT: A dataset of orange Citrus sinensis leaves for abnormality detection using image analysis techniques. Data in Brief 52, 109908. DOI 10.1016/j.dib.2023.109908"
    note: "Minatrice serpentina, cocciniglia rossa, acaro, macchia grassa, HLB e carenze di Fe, Mg, Mn, N, Zn."
  - name: agml_plum
    repo: Project-AgML/plum_leaf_fruit_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: prunus_domestica
    license: "CC BY 4.0"
    citation: "Nayeem R.A. et al. (2025) A comprehensive image dataset of Plum leaf and fruit for disease classification. Data in Brief 60, 111625. DOI 10.17632/w7sdx55m7z.1 (dati)"
    note: "Solo la versione non aumentata; usate solo le classi con diagnosi chiara (fori da insetti, sano)."
  - name: agml_pomegranate
    repo: Project-AgML/pomegranate_disease_classification
    files: ["raw/*.parquet"]
    use: disease
    crop: punica_granatum
    license: "CC BY 4.0"
    citation: "Mohammed B.A. et al. (2025) Pomegranate disease detection and classification dataset for deep learning applications: A case study from Halabja city. Data in Brief, 112298. DOI 10.5281/zenodo.15856012 (dati)"
    note: "Frutti: antracnosi (Colletotrichum), tignola del carrubo (Ectomyelois ceratoniae), scottature."
  - name: agml_fig
    repo: Project-AgML/fig_leaf_ficus_worm_classification
    files: ["data/*.parquet"]
    use: disease
    crop: ficus_carica
    license: "CC BY 4.0"
    citation: "Hafi S.J. et al. (2024) Image dataset of healthy and infected fig leaves with Ficus leaf worm. Data in Brief 53, 109958. DOI 10.17632/f7dk2yknff.2 (dati)"
    note: "Foglie di fico sane e con danni della tignola delle foglie del fico."
  - name: agml_citrusfruit
    repo: Project-AgML/citrus_fruit_leaf_disease_classification
    files: ["data/*.parquet"]
    use: disease
    crop: citrus_sinensis
    license: "CC BY 4.0"
    citation: "Rauf H.T. et al. (2019) A citrus fruits and leaves dataset for detection and classification of citrus diseases through machine learning. Data in Brief 26, 104340. DOI 10.1016/j.dib.2019.104340"
    note: "Frutti e foglie di agrumi: macchia nera, cancro batterico, greening, melanosi, ticchiolatura (parte della pianta indicata nel dataset)."
