# Avvisi per colture e organi in cui la foto non basta (malattie del legno). Mostrati dall'app quando
# l'utente indica la coltura e l'organo; fonti in configs/sources.yaml.
note:
  - colture: [vitis_vinifera]
    organi: [trunk, branch, root, whole_plant]
    titolo: "Malattie del legno della vite: malattia di Petri e mal dell'esca"
    testo: >-
      La malattia di Petri colpisce soprattutto le viti giovani (circa 1-5 anni): germogliamento tardivo,
      internodi corti, ingiallimenti tra le nervature, appassimenti e deperimento. È causata da funghi
      che colonizzano i vasi del legno, in particolare Phaeomoniella chlamydospora e Phaeoacremonium spp.,
      gli stessi che il Disciplinare della Regione Calabria indica per il mal dell'esca. Il segno tipico è
      nel legno: striature brune o nere visibili tagliando il fusto o il portinnesto. Le foglie da sole non
      bastano e l'infezione può essere senza sintomi: la conferma richiede l'isolamento in laboratorio o la
      PCR su campioni di legno. Il lettore non ha ancora questa classe: fotografa la sezione del legno e
      invia la foto con "Aiuta a migliorare", indicando "Malattia di Petri" nelle note.
    fonti: [petri_sintomi_2005, petri_pcr_2012, gtd_editoriale_2023, disc_calabria_2026]
