# Registro delle fonti usate per la base di conoscenza (configs/knowledge_base.yaml).
# stato:
#   testo_letto        = estratto il testo del documento e controllato il passaggio citato
#   riassunto_verificato = metadati e riassunto dell'articolo confermati, testo completo non letto
#   solo_metadati      = esistenza confermata, contenuto non letto (non usare per indicazioni tecniche)
# Le sostanze attive e le dosi dei documenti non sono riportate nel sistema.

sources:
  - id: disc_calabria_2023
