    date: "2024-10-14"
    status: testo_letto
    note: "Vettori afidi non persistenti (Myzus persicae tra i principali), categoria EPPO A2 e UE RNQP Allegato IV."

  - id: unirc_gullo_2020
    title: "First observations of graft combination on bergamot fruit quality, Femminello cultivar"
    issuer: "Gullo G., Dattola A., Zappia R. - Università Mediterranea di Reggio Calabria"
    type: universitario_calabria
    doi: "10.17660/th2020/75.4.4"
