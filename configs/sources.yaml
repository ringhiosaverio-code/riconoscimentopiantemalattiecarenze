    date: "2020"
    status: riassunto_verificato
    note: "Fruits 75(4):170-179. Abstract letto: il bergamotto è innestato su arancio amaro, molto suscettibile al CTV, presente in Calabria."

  # --- Riferimenti metodologici per i lettori ottici (non usati per le misure di gestione) ---
  - id: fazari_2021_unirc
    title: "Application of deep convolutional neural networks for the detection of anthracnose in olives using VIS/NIR hyperspectral images"
    issuer: "Fazari A., Pellicer-Valero O.J., Gómez-Sanchís J., Bernardi B., Cubero S., Benalia S., Zimbalatti G., Blasco J. - Università Mediterranea di Reggio Calabria (Dip. Agraria) e IVIA"
    type: universitario_calabria
    url: "https://iris.unirc.it/retrieve/e2047588-ec47-7e24-e053-6605fe0afb29/Fazari_2021_COMPAG_Application_post%20print.pdf"
    date: "2021"
    status: riassunto_verificato
    note: "Computers and Electronics in Agriculture 187 (2021). Rilevazione precoce della lebbra dell'olivo con CNN su immagini iperspettrali; dati non pubblici. Titolo e autori da confermare sul post-print."

  - id: cruz_2017_xfido
    title: "X-FIDO: An Effective Application for Detecting Olive Quick Decline Syndrome with Deep Learning and Data Fusion"
    issuer: "Cruz A.C., Luvisi A., De Bellis L., Ampatzidis Y. - Università del Salento e University of Florida"
    type: universitario_italia
    doi: "10.3389/fpls.2017.01741"
    url: "https://doi.org/10.3389/fpls.2017.01741"
    date: "2017"
    status: riassunto_verificato
    note: "Frontiers in Plant Science 8:1741. Rilevazione del disseccamento rapido dell'olivo da foto di foglie."

  - id: bruno_2023_cnr
    title: "Olive disease classification based on an adaptive ensemble of two EfficientNet-b0 models, for smartphone images"
    issuer: "Bruno A., Moroni D., Martinelli M. - CNR-ISTI, Pisa"
    type: ricerca_italia
    doi: "10.15439/2023F4794"
    url: "https://publications.cnr.it/doc/479293"
    date: "2023"
    status: riassunto_verificato
    note: "FedCSIS 2023. Insieme di due EfficientNet-B0 su foto da smartphone: principio usato anche nei lettori PlantCare (insieme di estrattori). Titolo esatto da confermare."

  - id: nuzzaci_1983_uniba
    title: "Gli Eriofidi (Acarina: Eriophyoidea) dell'olivo"
    issuer: "Nuzzaci G., Parenzan P. - Università di Bari, Entomologica"
    type: universitario_italia
    url: "https://ojs.uniba.it/index.php/entomol/article/view/572"
    date: "1983"
    status: riassunto_verificato
    note: "Rassegna delle specie di eriofidi dell'olivo (Aceria oleae, Oxycenus maxwelli, Tegolophus hassani, Ditrymacus athiasellus). Usata per il riconoscimento delle specie, non per le misure di difesa."

  # --- Preparazione della botte ---
  - id: purdue_mixing_order
    title: "Mixing order handout (schema Purdue, PSEP Vermont)"
    issuer: "University of Vermont - Pesticide Safety Education Program (da Purdue University)"
    type: universitario_internazionale
    url: "https://uvm.edu/d10-files/documents/2024-11/PSEP_VTPA23CentrellaMixingOrderHandout.pdf"
    status: riassunto_verificato
    note: "Ordine: sacchetti idrosolubili; secchi WG/WP/SG uno alla volta; sospensioni SC/SE/EW/CS; liquidi EC/OD/SL; coadiuvanti per ultimi."
  - id: vt_bse351
    title: "BSE-351: tank mixing (WALES/DALES)"
    issuer: "Virginia Tech, Cooperative Extension"
    type: universitario_internazionale
    url: "https://pubs.ext.vt.edu/BSE/bse-351/bse-351.html"
    status: riassunto_verificato
    note: "Leggere prima l'etichetta: l'ordine generico si usa solo se l'etichetta non lo indica."
  - id: edis_pi285
    title: "PI285: jar test per le miscele"
    issuer: "University of Florida, IFAS Extension (EDIS)"
    type: universitario_internazionale
    url: "https://journals.flvc.org/edis/article/download/117653/119782/181394"
    status: riassunto_verificato
    note: "Prova in barattolo su piccola scala; non rileva le incompatibilità chimiche."
  - id: er_manuale_zolfo
    title: "Manuale basso impatto - Zolfo (scheda 9.2.2)"
    issuer: "Regione Emilia-Romagna, Servizio fitosanitario"
    type: regionale_italia
    url: "https://agricoltura.regione.emilia-romagna.it/fitosanitario/difesa-sostenibile/uso-sostenibile/prodotti-fitosanitari/Manuale-basso-impatto/documenti/9-2-2-zolfo-14_03_24.pdf/@@download/file"
    date: "2024-03-14"
    status: riassunto_verificato
    note: "Zolfo non compatibile con oli minerali e con prodotti alcalini (polisolfuri, poltiglia bordolese); 21 giorni da olio ad alte dosi, 15 da olio estivo; fitotossicità sopra 30-32 °C."
  - id: er_manuale_oli
    title: "Manuale basso impatto - Oli minerali (scheda 9.2.4)"
    issuer: "Regione Emilia-Romagna, Servizio fitosanitario"
    type: regionale_italia
    url: "https://agricoltura.regione.emilia-romagna.it/fitosanitario/difesa-sostenibile/uso-sostenibile/prodotti-fitosanitari/Manuale-basso-impatto/documenti/9-2-4-oli-minerali-14_03_24.pdf/@@download/file"
    date: "2024-03-14"
    status: riassunto_verificato
    note: "Olio ad alte dosi distanziato almeno 15 giorni dallo zolfo; rischio di fitotossicità con caldo e umidità elevata."
  - id: er_manuale_polisolfuro
    title: "Manuale basso impatto - Polisolfuro di calcio (scheda 9.2.3)"
    issuer: "Regione Emilia-Romagna, Servizio fitosanitario"
    type: regionale_italia
    url: "https://agricoltura.regione.emilia-romagna.it/fitosanitario/difesa-sostenibile/uso-sostenibile/prodotti-fitosanitari/Manuale-basso-impatto/documenti/9-2-3-polisolfuro-di-calcio-14_03_24.pdf/@@download/file"
    date: "2024-03-14"
    status: riassunto_verificato
    note: "Distanziare almeno 15 giorni da oli minerali; non usare sopra 30 °C né con previsione di gelate."
  - id: bayer_miscele
    title: "Le miscele di agrofarmaci (AgriCampus)"
    issuer: "Bayer CropScience Italia"
    type: tecnico_produttore
    url: "https://www.cropscience.bayer.it/-/media/agricampus/documenti/miscele.pdf"
    status: riassunto_verificato
    note: "Con fosetil-Al e formulati SC o CS, questi ultimi vanno immessi per primi."

  # Protocolli diagnostici EPPO (serie PM 7): passaggi letti nel PDF il 2026-11-20 e usati in
  # configs/lab_requirements.yaml per dire quando serve il laboratorio.
  - id: eppo_pm7_024
    title: "PM 7/24 Xylella fastidiosa - protocollo diagnostico"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/148/pm7-024-5-en_rev.pdf"
    status: testo_letto
    note: "PM 7/24 (5): test di screening ELISA, DTBIA, IF, PCR convenzionale e real-time, LAMP; X. fastidiosa si considera rilevata con almeno due test positivi basati su principi biologici diversi (o su parti diverse del genoma). Categoria letta sulla scheda EPPO il 2026-11-25: quarantena UE, Allegato II B; EPPO A2."
  - id: eppo_pm7_032
    title: "PM 7/32 (2) Plum pox virus - protocollo diagnostico"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/156/pm7-032-2-en.pdf"
    status: testo_letto
    note: "Campioni sintomatici e asintomatici: DAS-ELISA, TAS-ELISA, RT-PCR convenzionale e real-time; nei casi critici secondo test con principio diverso."
  - id: eppo_pm7_138
    title: "PM 7/138 (1) Pospiviroids (genus Pospiviroid) - protocollo diagnostico"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/762/pm7-138-1-en.pdf"
    status: testo_letto
    note: "'Viroids do not code for any protein'; rilevamento con RT-PCR e real-time RT-PCR."
  - id: eppo_pm7_044
    title: "PM 7/44 (2) Xanthomonas citri pv. citri e pv. aurantifolii - protocollo diagnostico"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/168/pm7-044-2-en.pdf"
    status: testo_letto
    note: "Screening con isolamento e almeno due test molecolari."
  - id: eppo_pm7_133
    title: "PM 7/133 (1) Generic detection of phytoplasmas"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/741/pm7-133-1-en.pdf"
    status: testo_letto
    note: "Rilevamento generico dei fitoplasmi con PCR (nested con P1/P7 e R16F2n/R16R2, real-time)."
  - id: eppo_pm7_119
    title: "PM 7/119 (1) Nematode extraction"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/648/pm7-119-1-en.pdf"
    status: testo_letto
    note: "Metodi di estrazione da terreno e piante; i nematodi si identificano al microscopio."
  - id: eppo_pm7_121
    title: "PM 7/121 (2) 'Candidatus Liberibacter africanus', 'americanus' e 'asiaticus' (huanglongbing)"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/646/pm7-121-2-en.pdf"
    status: testo_letto
    note: "Sintomi fogliari simili alle carenze di zinco, rame o manganese, ma asimmetrici; screening con real-time PCR."
  - id: eppo_pm7_116
    title: "PM 7/116 (2) Tetranychus evansi"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/240/pm7-116-02-en.pdf"
    status: testo_letto
    note: "'Specific identification requires examination of slide mounted specimens of both an adult male and a female'."
  - id: eppo_pm7_038
    title: "PM 7/38 (2) Unaspis citri"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/162/pm7-038-2-en.pdf"
    status: testo_letto
    note: "Le cocciniglie si identificano su preparati chiarificati, colorati e montati su vetrino; identificazione formale al microscopio composto."
  - id: eppo_pm7_056
    title: "PM 7/56 (1) Scirtothrips aurantii, S. citri, S. dorsalis"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/180/pm7-056-1-en.pdf"
    status: testo_letto
    note: "Per l'identificazione servono esemplari chiarificati su vetrino, ingrandimento 100-600x."
  - id: eppo_pm7_124
    title: "PM 7/124 (1) Spodoptera littoralis, S. litura, S. frugiperda, S. eridania"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/649/pm7-124-1-en.pdf"
    status: testo_letto
    note: "Nessun carattere generale separa le larve di Spodoptera dalle altre nottue; larve di S. littoralis e S. litura indistinguibili nella maggior parte degli stadi."
  - id: eppo_pm7_017
    title: "PM 7/17 (3) Phyllosticta citricarpa"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/141/pm7-017-3-en.pdf"
    status: testo_letto
    note: "Sintomi confondibili con quelli di Phyllosticta citriasiana; identificazione morfologica difficile, sequenziamento per distinguere P. citricarpa da P. paracitricarpa."
  - id: eppo_categorizzazione
    title: "EPPO Global Database - pagine 'categorization' degli organismi in configs/lab_requirements.yaml"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/taxon/XANTCI/categorization"
    date: "2026-11-20"
    status: testo_letto
    note: "Riga UE (allegati del Reg. (UE) 2019/2072) e lista EPPO lette per ogni codice; l'URL di ogni organismo è https://gd.eppo.int/taxon/<codice>/categorization."
  - id: eppo_pm7_007
    title: "PM 7/7 (2) Aleurocanthus citriperdus, A. spiniferus e A. woglumi"
    issuer: "EPPO"
    type: internazionale
    url: "https://gd.eppo.int/download/standard/131/pm7-007-02-en.pdf"
    status: testo_letto
    note: "L'identificazione dei pupari richiede il montaggio su vetrino e la chiave del protocollo; caratteri osservati al microscopio composto."
  - id: petri_pcr_2012
    title: "Real-Time PCR Detection of Phaeomoniella chlamydospora and Phaeoacremonium aleophilum (Applied and Environmental Microbiology)"
    issuer: "American Society for Microbiology"
    type: internazionale
    url: "https://journals.asm.org/doi/10.1128/aem.07360-11"
    status: riassunto_verificato
    note: "Test PCR in tempo reale per i funghi della malattia di Petri nel legno; la diagnosi è complicata da assenza di sintomi e bassa concentrazione del fungo."
  - id: gtd_editoriale_2023
    title: "Editorial: Fungal pathogens causing the grapevine trunk diseases - biology and identification (Frontiers in Fungal Biology)"
    issuer: "Frontiers"
    type: internazionale
    url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10512359/"
    status: riassunto_verificato
    note: "Malattie del legno della vite: funghi coinvolti e identificazione."
  - id: disc_calabria_2026
    title: "Disciplinari di produzione integrata 2026 - Difesa e controllo infestanti, Regione Calabria (Allegato A)"
    issuer: "Regione Calabria (documento pubblicato da ARSAC)"
    type: regionale_calabria
    url: "https://www.arsacweb.it/wp-content/uploads/2026/04/Disciplinari-Difesa-e-Diserbo-2026-Regione-Calabria-Allegato-A_.pdf"
    status: testo_letto
    note: "Tabelle di difesa lette con scripts/import_disciplinare.py; vite da vino: mal dell'esca (Phaeoacremonium aleophilum, Phaeomoniella chlamydospora, Fomitiporia mediterranea)."
  - id: petri_sintomi_2005
    title: "4th International Workshop on Grapevine Trunk Diseases, abstracts (Phytopathologia Mediterranea 44, 2005)"
    issuer: "Phytopathologia Mediterranea (copia University of California ANR)"
    type: internazionale
    url: "https://ucanr.edu/sites/default/files/2021-01/343528.pdf"
    status: riassunto_verificato
    note: "Malattia di Petri: viti di 1-5 anni, germogliamento tardivo, internodi corti, clorosi internervale, deperimento; nel legno striature brune e necrosi."
