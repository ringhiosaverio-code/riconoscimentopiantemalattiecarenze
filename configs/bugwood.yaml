# Foto da Bugwood Images (Università della Georgia: ipmimages.org, forestryimages.org): soggetti
# identificati da specialisti, foto citate con autore. Licenza: uso non commerciale con citazione
# (CC BY-NC 3.0 US; alcune CC BY 3.0 US). Solo addestramento, mai nel quiz.
# sci: nome del soggetto su Bugwood (anche con patovar); classe: etichetta del lettore (disease) o
# "pest:inat:<specie>" per il lettore degli insetti; coltura: solo se l'ospite è certo.
# Si tengono solo le foto di campo (sintomi, danni, stadi dell'insetto): niente colture in piastra,
# microscopio o disegni (vedi SCARTA in scripts/import_bugwood.py).

