# Tassonomia del sistema PlantCare
# ---------------------------------------------------------------
# Ogni classe ha un identificativo stabile (id), un nome leggibile e,
# quando esiste, un riferimento standard (EPPO code, ID GBIF/Catalogue of Life,
# codice di malattia, ecc.). Gli id NON vanno rinominati: il modello
# e i dataset dipendono da essi.
#
# Il sistema è MULTI-TASK: una foto può avere più etichette in parallelo
# (es. pianta = pomodoro, malattia = peronospora, carenza = nessuna).

version: 0.1.0

# ---------------------------------------------------------------
# 1. SPECIE VEGETALI (colture di interesse agrario prioritarie)
# ---------------------------------------------------------------
plants:
  - {id: solanum_lycopersicum, common: Pomodoro, family: Solanaceae}
  - {id: solanum_tuberosum, common: Patata, family: Solanaceae}
  - {id: capsicum_annuum, common: Peperone, family: Solanaceae}
  - {id: vitis_vinifera, common: Vite, family: Vitaceae}
  - {id: malus_domestica, common: Melo, family: Rosaceae}
  - {id: prunus_persica, common: Pesco, family: Rosaceae}
  - {id: olea_europaea, common: Olivo, family: Oleaceae}
  - {id: triticum_aestivum, common: Frumento tenero, family: Poaceae}
  - {id: zea_mays, common: Mais, family: Poaceae}
  - {id: citrus_sinensis, common: Arancio, family: Rutaceae}
  - {id: lactuca_sativa, common: Lattuga, family: Asteraceae}
  - {id: cucumis_sativus, common: Cetriolo, family: Cucurbitaceae}
  - {id: actinidia_chinensis, common: Kiwi, family: Actinidiaceae}
  # Estendibile: aggiungere qui nuove specie senza modificare il codice.

# ---------------------------------------------------------------
# 2. AGENTI DI DANNO (causa della patologia)
# ---------------------------------------------------------------
# Il "tipo di agente" è la categoria di primo livello richiesta dal progetto.
# Nota scientifica: dal solo sintomo visivo non sempre è possibile distinguere
# la causa; per virus e viroidi la conferma richiede test di laboratorio
# (ELISA, RT-PCR, sequenziamento). Il modello stima la PROBABILITÀ di categoria.
pathogen_types:
  - {id: fungal, label: Fungina, description: "Funghi e pseudofunghi (Oomiceti)"}
  - {id: viral, label: Virale, description: "Virus a RNA o DNA"}
  - {id: viroid, label: Viroide, description: "RNA circolare a singolo filamento privo di capside"}
  - {id: bacterial, label: Batterica, description: "Batteri e fitoplasmi (Mollicutes, trasmessi da vettori)"}
  - {id: insect_induced, label: Causata da insetti, description: "Danni diretti o vettori di patogeni"}
  - {id: nematode, label: Nematodica, description: "Nematodi fitoparassiti (opzionale, fase 2)"}
  - {id: abiotic, label: Abiotica, description: "Stress idrico, termico, fitotossicità, grandine, ecc."}
  - {id: nutritional, label: Nutrizionale, description: "Carenze o eccessi di macro/micro elementi"}
  - {id: healthy, label: Sana, description: "Nessun sintomo rilevato"}

# ---------------------------------------------------------------
# 3. MALATTIE (esempi iniziali per le colture prioritarie)
# ---------------------------------------------------------------
# Campi:
#   pathogen_type : id di pathogen_types
#   agent         : nome scientifico dell'agente causale
#   hosts         : id di plants
#   symptoms      : descrizione visiva (usata anche per annotare i dataset)
diseases:
  - id: tomato_late_blight
    common: Peronospora del pomodoro
    pathogen_type: fungal
    agent: Phytophthora infestans
    hosts: [solanum_lycopersicum, solanum_tuberosum]
    symptoms: Macchie brune acquose sulle foglie con alone clorotico, muffa bianca sul rovescio
  - id: tomato_early_blight
    common: Alternaria del pomodoro
    pathogen_type: fungal
    agent: Alternaria solani
    hosts: [solanum_lycopersicum, solanum_tuberosum]
    symptoms: Macchie brune concentriche a bersaglio sulle foglie più vecchie
  - id: powdery_mildew_grapevine
    common: Oidio della vite
    pathogen_type: fungal
    agent: Erysiphe necator
    hosts: [vitis_vinifera]
    symptoms: Feltro bianco-grigiastro polverulento su foglie, grappoli e germogli
  - id: tomato_mosaic_virus
    common: Mosaico del pomodoro
    pathogen_type: viral
    agent: Tomato mosaic virus (ToMV)
    hosts: [solanum_lycopersicum]
    symptoms: Mosaico clorotico, foglie deformate, filloidia
  - id: potato_spindle_tuber
    common: Tuberi fusiformi della patata
    pathogen_type: viroid
    agent: Potato spindle tuber viroid (PSTVd)
    hosts: [solanum_tuberosum, solanum_lycopersicum]
    symptoms: Foglie erette, nanismo, tuberi allungati e fusiformi
  - id: bacterial_canker_kiwi
    common: Cancro batterico del kiwi
    pathogen_type: bacterial
    agent: Pseudomonas syringae pv. actinidiae
    hosts: [actinidia_chinensis]
    symptoms: Essudati rossastri, cancri su tronco e rami, necrosi fogliare
  - id: olive_knot
    common: Rogna dell'olivo
    pathogen_type: bacterial
    agent: Pseudomonas savastanoi pv. savastanoi
    hosts: [olea_europaea]
    symptoms: Tumori legnosi su rami e tronco
  - id: grapevine_flavescence_doree
    common: Flavescenza dorata della vite
    pathogen_type: bacterial          # fitoplasma (classe Mollicutes), non un batterio classico
    agent: "Fitoplasma della flavescenza dorata (vettore: Scaphoideus titanus)"
    hosts: [vitis_vinifera]
    symptoms: Ingiallimento o arrossamento fogliare, accartocciamento verso il basso, grappoli disseccati
  - id: insect_feeding_damage_generic
    common: Danno diretto da insetti fitofagi (non identificato)
    pathogen_type: insect_induced
    agent: Insetti fitofagi non identificati
    hosts: []
    symptoms: Erosioni, fori, rosure, deformazioni fogliari senza patogeno identificabile
  - id: healthy
    common: Pianta sana
    pathogen_type: healthy
    agent: null
    hosts: []
    symptoms: Nessun sintomo visibile

# ---------------------------------------------------------------
# 4. INSETTI
# ---------------------------------------------------------------
# role:
#   phytophagous  : fitofago (si nutre di piante; dannoso)
#   entomophagous : entomofago (predatore o parassitoide di altri insetti; utile)
#   pollinator    : impollinatore (utile, da proteggere)
#   neutral       : altro / non classificato
insects:
  # --- fitofagi ---
  - {id: aphid_myzus_persicae, common: Afide verde del pesco, role: phytophagous, order: Hemiptera, family: Aphididae}
  - {id: whitefly_trialeurodes, common: Aleurode delle serre, role: phytophagous, order: Hemiptera, family: Aleyrodidae}
  - {id: colorado_beetle, common: Dorifora della patata, role: phytophagous, order: Coleoptera, family: Chrysomelidae}
  - {id: tuta_absoluta, common: Tignola del pomodoro, role: phytophagous, order: Lepidoptera, family: Gelechiidae}
  - {id: thrips_frankliniella, common: Tripide dei fiori, role: phytophagous, order: Thysanoptera, family: Thripidae}
  - {id: scaphoideus_titanus, common: Cicalina della flavescenza, role: phytophagous, order: Hemiptera, family: Cicadellidae}
  # --- entomofagi (utili) ---
  - {id: coccinella_septempunctata, common: Coccinella a sette punti, role: entomophagous, order: Coleoptera, family: Coccinellidae}
  - {id: chrysoperla_carnea, common: Crisopa, role: entomophagous, order: Neuroptera, family: Chrysopidae}
  - {id: aphidius_colemani, common: Imenottero parassitoide degli afidi, role: entomophagous, order: Hymenoptera, family: Braconidae}
  - {id: orius_laevigatus, common: Antocoride predatore dei tripidi, role: entomophagous, order: Hemiptera, family: Anthocoridae}
  - {id: phytoseiulus_persimilis, common: Acaro predatore (fitoseide), role: entomophagous, order: Acari, family: Phytoseiidae, note: "Acaro, non insetto: incluso per utilità pratica"}
  # --- impollinatori ---
  - {id: apis_mellifera, common: Ape domestica, role: pollinator, order: Hymenoptera, family: Apidae}

# ---------------------------------------------------------------
# 5. CARENZE NUTRIZIONALI
# ---------------------------------------------------------------
# class: macro (mg/kg nell'ordine dei g/kg) | micro (mg/kg o inferiori)
# Nota: i sintomi sono spesso aspecifici e confondibili con virosi, stress
# idrico o parassiti. Il modello deve sempre restituire anche "non determinabile".
nutrients:
  macro:
    - {id: N, name: Azoto, symptoms: Clorosi uniforme delle foglie vecchie, stunting}
    - {id: P, name: Fosforo, symptoms: Colorazione violacea su foglie vecchie, crescita ridotta}
    - {id: K, name: Potassio, symptoms: Bordi fogliari necrotici su foglie vecchie}
    - {id: Ca, name: Calcio, symptoms: Marciume apicale dei frutti, necrosi dei giovani apici}
    - {id: Mg, name: Magnesio, symptoms: Clorosi internervale su foglie vecchie}
    - {id: S, name: Zolfo, symptoms: Clorosi su foglie giovani}
  micro:
    - {id: Fe, name: Ferro, symptoms: Clorosi internervale su foglie giovani}
    - {id: Mn, name: Manganese, symptoms: Clorosi internervale a macchie su foglie giovani}
    - {id: Zn, name: Zinco, symptoms: Foglie piccole, internodi corti, rosettatura}
    - {id: Cu, name: Rame, symptoms: Apici appassiti, foglie scure e distorte}
    - {id: B, name: Boro, symptoms: Necrosi dei giovani germogli, frutti deformati}
    - {id: Mo, name: Molibdeno, symptoms: Clorosi e necrosi marginale, deformazione lamina}
    - {id: Cl, name: Cloro, symptoms: Clorosi e necrosi su foglie vecchie (raro, quasi sempre da eccesso)}
  unknown: {id: unknown, name: Carenza non determinabile}
