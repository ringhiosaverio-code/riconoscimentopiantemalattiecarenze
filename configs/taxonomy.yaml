# Tassonomia del sistema PlantCare
# ---------------------------------------------------------------
# Ogni classe ha un id stabile: NON rinominarlo (modelli e dataset dipendono da esso).
#
# Colture, campo priority:
#   1 = coltura di maggior interesse agrario in Italia
#   2 = coltura tropicale o subtropicale presente in Calabria
#   3 = coltura di interesse locale in Calabria (es. prodotti tipici)
#
# Malattie: ogni malattia elenca gli organi colpiti (organs) e i sintomi
# per organo (organ_symptoms). Gli organi possono essere foglia, frutto, fiore,
# infiorescenza, fusto, ramo, tronco, radice, tubero, bulbo.
#
# ATTENZIONE: agenti, ospiti e sintomi sono un elenco iniziale da far
# validare a un fitopatologo prima dell'uso. I sintomi per organo sono sintesi.

version: 0.7.0

# ---------------------------------------------------------------
# 0. ORGANI DELLA PIANTA
# ---------------------------------------------------------------
plant_organs:
  - {id: leaf, label: "Foglia"}
  - {id: flower, label: "Fiore"}
  - {id: inflorescence, label: "Infiorescenza o spiga"}
  - {id: fruit, label: "Frutto o bacca"}
  - {id: stem, label: "Fusto o culmo (piante erbacee)"}
  - {id: branch, label: "Ramo o germoglio (piante legnose)"}
  - {id: trunk, label: "Tronco o colletto (piante legnose)"}
  - {id: root, label: "Radice"}
  - {id: tuber, label: "Tubero"}
  - {id: bulb, label: "Bulbo"}
  - {id: whole_plant, label: "Pianta intera"}

# ---------------------------------------------------------------
# 1. COLTURE
# ---------------------------------------------------------------
plants:
  # --- priorità 1: Italia ---
  - {id: triticum_aestivum, common: "Frumento tenero", family: Poaceae, priority: 1, zone: italia}
  - {id: triticum_durum, common: "Frumento duro", family: Poaceae, priority: 1, zone: italia}
  - {id: zea_mays, common: "Mais", family: Poaceae, priority: 1, zone: italia}
  - {id: vitis_vinifera, common: "Vite", family: Vitaceae, priority: 1, zone: italia}
  - {id: olea_europaea, common: "Olivo", family: Oleaceae, priority: 1, zone: italia}
  - {id: solanum_lycopersicum, common: "Pomodoro", family: Solanaceae, priority: 1, zone: italia}
  - {id: solanum_tuberosum, common: "Patata", family: Solanaceae, priority: 1, zone: italia}
  - {id: malus_domestica, common: "Melo", family: Rosaceae, priority: 1, zone: italia}
  - {id: pyrus_communis, common: "Pero", family: Rosaceae, priority: 1, zone: italia}
  - {id: prunus_domestica, common: "Susino", family: Rosaceae, priority: 2, zone: italia}
  - {id: ficus_carica, common: "Fico", family: Moraceae, priority: 2, zone: italia}
  - {id: punica_granatum, common: "Melograno", family: Lythraceae, priority: 2, zone: italia}
  - {id: prunus_persica, common: "Pesco", family: Rosaceae, priority: 1, zone: italia}
  - {id: prunus_avium, common: "Ciliegio dolce", family: Rosaceae, priority: 1, zone: italia}
  - {id: actinidia_chinensis, common: "Kiwi", family: Actinidiaceae, priority: 1, zone: italia}
  - {id: citrus_sinensis, common: "Arancio", family: Rutaceae, priority: 1, zone: italia}
  - {id: citrus_limon, common: "Limone", family: Rutaceae, priority: 1, zone: italia}
  - {id: citrus_reticulata, common: "Mandarino", family: Rutaceae, priority: 1, zone: italia}
  - {id: corylus_avellana, common: "Nocciolo", family: Betulaceae, priority: 1, zone: italia}
  - {id: fragaria_ananassa, common: "Fragola", family: Rosaceae, priority: 1, zone: italia}
  - {id: lactuca_sativa, common: "Lattuga", family: Asteraceae, priority: 1, zone: italia}
  - {id: capsicum_annuum, common: "Peperone", family: Solanaceae, priority: 1, zone: italia}
  - {id: solanum_melongena, common: "Melanzana", family: Solanaceae, priority: 1, zone: italia}
  - {id: cucurbita_pepo, common: "Zucchina", family: Cucurbitaceae, priority: 1, zone: italia}
  - {id: cucumis_sativus, common: "Cetriolo", family: Cucurbitaceae, priority: 1, zone: italia}
  - {id: cynara_cardunculus, common: "Carciofo", family: Asteraceae, priority: 1, zone: italia}
  - {id: allium_sativum, common: "Aglio", family: Amaryllidaceae, priority: 1, zone: italia}
  - {id: brassica_oleracea_italica, common: "Broccolo", family: Brassicaceae, priority: 1, zone: italia}
  # --- priorità 2: tropicali / subtropicali in Calabria ---
  - {id: citrus_bergamia, common: "Bergamotto", family: Rutaceae, priority: 2, zone: calabria_subtropicale}
  - {id: persea_americana, common: "Avocado", family: Lauraceae, priority: 2, zone: calabria_subtropicale}
  - {id: musa_spp, common: "Banano", family: Musaceae, priority: 2, zone: calabria_subtropicale}
  - {id: annona_cherimola, common: "Cherimoya", family: Annonaceae, priority: 2, zone: calabria_subtropicale}
  - {id: opuntia_ficus_indica, common: "Fico d'India", family: Cactaceae, priority: 2, zone: calabria_subtropicale}
  # --- priorità 3: interesse locale in Calabria ---
  - {id: allium_cepa_tropea, common: "Cipolla rossa di Tropea", family: Amaryllidaceae, priority: 3, zone: calabria}
  - {id: capsicum_annuum_peperoncino, common: "Peperoncino calabrese", family: Solanaceae, priority: 3, zone: calabria}
  # Estendibile: aggiungere qui nuove colture senza modificare il codice.

# ---------------------------------------------------------------
# 2. AGENTI DI DANNO (categoria di primo livello)
# ---------------------------------------------------------------
# Dal solo sintomo visivo non sempre è possibile distinguere la causa:
# per virus e viroidi la conferma richiede ELISA, RT-PCR o sequenziamento.
pathogen_types:
  - {id: fungal, label: "Fungina", description: "Funghi e Oomiceti (pseudofunghi)"}
  - {id: viral, label: "Virale", description: "Virus a RNA o DNA"}
  - {id: viroid, label: "Viroide", description: "RNA circolare a singolo filamento, privo di capside"}
  - {id: bacterial, label: "Batterica", description: "Batteri e fitoplasmi (Mollicutes, trasmessi da vettori)"}
  - {id: insect_induced, label: "Causata da insetti", description: "Danni diretti o da insetti vettori non riconducibili a un patogeno"}
  - {id: nematode, label: "Nematodica", description: "Nematodi fitoparassiti"}
  - {id: abiotic, label: "Abiotica", description: "Stress idrico, termico, fitotossicità, grandine"}
  - {id: nutritional, label: "Nutrizionale", description: "Carenze o eccessi di macro e micro elementi"}
  - {id: healthy, label: "Sana", description: "Nessun sintomo rilevato"}

# ---------------------------------------------------------------
# 3. MALATTIE E DANNI
# ---------------------------------------------------------------
diseases:

  # ===== POMODORO =====
  - id: tomato_late_blight
    common: "Peronospora del pomodoro"
    pathogen_type: fungal
    agent: "Phytophthora infestans"
    hosts: [solanum_lycopersicum, solanum_tuberosum]
    organs: [leaf, fruit, stem]
    symptoms: "Lesioni acquose e necrotiche che si estendono rapidamente"
    organ_symptoms:
      leaf: "Macchie brune acquose con alone clorotico; muffa bianca sul rovescio in umido"
      fruit: "Marciume bruno-olivastro con superficie dura e coriacea"
      stem: "Lesioni scure e allungate sul fusto"
  - id: tomato_early_blight
    common: "Alternaria del pomodoro"
    pathogen_type: fungal
    agent: "Alternaria solani"
    hosts: [solanum_lycopersicum, solanum_tuberosum]
    organs: [leaf, stem, fruit, tuber]
    symptoms: "Macchie scure con anelli concentrici"
    organ_symptoms:
      leaf: "Macchie brune concentriche a bersaglio sulle foglie più vecchie"
      stem: "Lesioni scure con anelli sul fusto"
      fruit: "Lesioni scure infossate con anelli vicino al calice"
      tuber: "Lesioni depresse scure con bordo netto (patata)"
  - id: tomato_mosaic_virus
    common: "Mosaico del pomodoro"
    pathogen_type: viral
    agent: "Tomato mosaic virus (ToMV)"
    hosts: [solanum_lycopersicum]
    organs: [leaf, fruit]
    symptoms: "Mosaico clorotico e deformazioni fogliari"
    organ_symptoms:
      leaf: "Mosaico clorotico, foglie deformate, filloidia"
      fruit: "Maculature chiare e deformazioni dei frutti"
  - id: tomato_yellow_leaf_curl
    common: "Accartocciamento giallo del pomodoro"
    pathogen_type: viral
    agent: "Tomato yellow leaf curl virus (TYLCV, Begomovirus)"
    hosts: [solanum_lycopersicum]
    organs: [leaf, flower]
    symptoms: "Accartocciamento e ingiallimento fogliare, nanismo"
    organ_symptoms:
      leaf: "Accartocciamento verso l'alto e ingiallimento dei margini, nanismo; trasmesso dalla mosca bianca"
      flower: "Caduta dei fiori giovani"
  - id: tomato_leafminer_damage
    common: "Danno da tignola del pomodoro (Tuta absoluta)"
    pathogen_type: insect_induced
    agent: "Tuta absoluta"
    hosts: [solanum_lycopersicum]
    organs: [leaf, fruit]
    symptoms: "Mine fogliari e fori nei frutti"
    organ_symptoms:
      leaf: "Mine serpiginose tra le pagine fogliari"
      fruit: "Fori di ingresso con escrementi, marciumi secondari"

  # ===== PATATA =====
  - id: potato_spindle_tuber
    common: "Tuberi fusiformi della patata"
    pathogen_type: viroid
    agent: "Potato spindle tuber viroid (PSTVd)"
    hosts: [solanum_tuberosum, solanum_lycopersicum]
    organs: [leaf, tuber]
    symptoms: "Foglie erette, nanismo, tuberi allungati"
    organ_symptoms:
      leaf: "Foglie erette e piccole, nanismo della pianta"
      tuber: "Tuberi allungati e fusiformi"
  - id: potato_common_scab
    common: "Rogna comune della patata"
    pathogen_type: bacterial
    agent: "Streptomyces scabies"
    hosts: [solanum_tuberosum]
    organs: [tuber, root]
    symptoms: "Lesioni superficiali rugose sul tubero"
    organ_symptoms:
      tuber: "Lesioni superficiali rugose, suberose, sulla buccia"
      root: "Lesioni sulle radici e stoloni"
  - id: potato_blackleg
    common: "Marciume nero del colletto della patata"
    pathogen_type: bacterial
    agent: "Pectobacterium atrosepticum (Dickeya spp.)"
    hosts: [solanum_tuberosum]
    organs: [stem, tuber]
    symptoms: "Annerimento e marciume molle alla base del fusto"
    organ_symptoms:
      stem: "Annerimento nero alla base del fusto, marciume molle"
      tuber: "Marciume molle e maleodorante, a partire dal peduncolo"
  - id: potato_dry_rot
    common: "Marciume secco della patata"
    pathogen_type: fungal
    agent: "Fusarium sambucinum"
    hosts: [solanum_tuberosum]
    organs: [tuber]
    symptoms: "Lesioni depresse e cavità con muffa"
    organ_symptoms:
      tuber: "Lesioni depresse con cavità interne e muffa bianca o rosata"
  - id: potato_virus_y
    common: "Virus Y della patata"
    pathogen_type: viral
    agent: "Potato virus Y (PVY)"
    hosts: [solanum_tuberosum, solanum_lycopersicum, capsicum_annuum]
    organs: [leaf, tuber]
    symptoms: "Mosaico e necrosi fogliare, necrosi nei tuberi"
    organ_symptoms:
      leaf: "Mosaico, necrosi venosa e rugosità fogliare"
      tuber: "Necrosi anulare o a rete nella polpa"
  - id: potato_verticillium_wilt
    common: "Verticilliosi della patata"
    pathogen_type: fungal
    agent: "Verticillium dahliae"
    hosts: [solanum_tuberosum]
    organs: [leaf, stem]
    symptoms: "Appassimento progressivo da un lato della pianta"
    organ_symptoms:
      leaf: "Ingiallimento e appassimento da un lato della pianta"
      stem: "Imbrunimento dei vasi nel fusto alla sezione trasversale"
  - id: potato_rhizoctonia
    common: "Rizoctoniosi della patata"
    pathogen_type: fungal
    agent: "Rhizoctonia solani"
    hosts: [solanum_tuberosum]
    organs: [stem, tuber, root]
    symptoms: "Cancri alla base del fusto e sclerozi sui tuberi"
    organ_symptoms:
      stem: "Cancri scuri alla base del fusto, germogli rallentati"
      tuber: "Sclerozi neri e rugosi sulla buccia, crosta nera"
      root: "Lesioni e marciumi sulle radici e stoloni"
  - id: potato_colorado_beetle
    common: "Danno da dorifora della patata"
    pathogen_type: insect_induced
    agent: "Leptinotarsa decemlineata"
    hosts: [solanum_tuberosum, solanum_lycopersicum, solanum_melongena]
    organs: [leaf]
    symptoms: "Defogliazione per larve e adulti"
    organ_symptoms:
      leaf: "Defogliazione, larve rosso-arancio sulla pagina inferiore"

  # ===== VITE =====
  - id: powdery_mildew_grapevine
    common: "Oidio della vite"
    pathogen_type: fungal
    agent: "Erysiphe necator"
    hosts: [vitis_vinifera]
    organs: [leaf, fruit, branch]
    symptoms: "Feltro bianco-grigiastro polverulento"
    organ_symptoms:
      leaf: "Feltro bianco-grigiastro sulla pagina superiore"
      fruit: "Acini ricoperti di feltro, con screpolature e marciume"
      branch: "Germogli e tralci con feltro bianco"
  - id: grapevine_downy_mildew
    common: "Peronospora della vite"
    pathogen_type: fungal
    agent: "Plasmopara viticola"
    hosts: [vitis_vinifera]
    organs: [leaf, fruit]
    symptoms: "Macchie d'olio sulle foglie, muffa bianca sul rovescio"
    organ_symptoms:
      leaf: "Macchie gialle ad olio sulla pagina superiore, muffa bianca sul rovescio"
      fruit: "Acini grigi o bruni appassiti, ricoperti di muffa bianca"
  - id: grapevine_grey_mould
    common: "Muffa grigia della vite"
    pathogen_type: fungal
    agent: "Botrytis cinerea"
    hosts: [vitis_vinifera, fragaria_ananassa]
    organs: [fruit, flower]
    symptoms: "Marciume grigio con feltro di spore"
    organ_symptoms:
      fruit: "Marciume grigio con feltro di spore sugli acini, spesso a grappolo"
      flower: "Imbrunimento e avvizzimento dei fiori"
  - id: grapevine_esca
    common: "Mal dell'esca"
    pathogen_type: fungal
    agent: "Complesso del mal dell'esca (Phaeomoniella chlamydospora, Phaeoacremonium minimum)"
    hosts: [vitis_vinifera]
    organs: [leaf, trunk, fruit]
    symptoms: "Decolorazione a tigre delle foglie e carie del legno"
    organ_symptoms:
      leaf: "Decolorazione a tigre con macchie clorotiche o necrotiche tra le nervature"
      trunk: "Carie e necrosi del legno, a volte con apoplessia improvvisa"
      fruit: "Acini che si disseccano sul grappolo"
  - id: grapevine_flavescence_doree
    common: "Flavescenza dorata della vite"
    pathogen_type: bacterial
    agent: "Fitoplasma della flavescenza dorata (vettore: Scaphoideus titanus)"
    hosts: [vitis_vinifera]
    organs: [leaf, fruit, branch]
    symptoms: "Ingiallimento o arrossamento fogliare, accartocciamento"
    organ_symptoms:
      leaf: "Ingiallimento o arrossamento fogliare, accartocciamento verso il basso"
      fruit: "Grappoli disseccati e acini raggrinziti"
      branch: "Tralci non lignificati e con cattiva maturazione"

  # ===== OLIVO =====
  - id: olive_knot
    common: "Rogna dell'olivo"
    pathogen_type: bacterial
    agent: "Pseudomonas savastanoi pv. savastanoi"
    hosts: [olea_europaea]
    organs: [branch, trunk]
    symptoms: "Tumori legnosi su rami e tronco"
    organ_symptoms:
      branch: "Tumori legnosi e rugosi sui rami giovani"
      trunk: "Tumori sul tronco e al colletto, che si spaccano"
  - id: olive_xylella_quick_decline
    common: "Complesso del disseccamento rapido dell'olivo"
    pathogen_type: bacterial
    agent: "Xylella fastidiosa subsp. pauca"
    hosts: [olea_europaea]
    organs: [leaf, branch]
    symptoms: "Disseccamento di rami e chioma, bruciature fogliari"
    organ_symptoms:
      leaf: "Clorosi e bruciature dei margini, spesso su un lato della chioma"
      branch: "Disseccamento di rami e chioma dall'apice verso il basso"
  - id: olive_peacock_spot
    common: "Occhio di pavone dell'olivo"
    pathogen_type: fungal
    agent: "Venturia oleaginea (anamorfo Spilocaea oleaginea)"
    hosts: [olea_europaea]
    organs: [leaf]
    symptoms: "Macchie circolari scure con alone"
    organ_symptoms:
      leaf: "Macchie circolari scure con alone giallo, come un occhio di pavone"
  - id: olive_anthracnose
    common: "Lebbra dell'olivo"
    pathogen_type: fungal
    agent: "Colletotrichum acutatum"
    hosts: [olea_europaea]
    organs: [fruit, leaf]
    symptoms: "Marciume depresso sul frutto, con massa di spore rosate"
    organ_symptoms:
      fruit: "Macchie depresse scure che si allargano, massa di spore rosata in umido"
      leaf: "Lesioni necrotiche sulle foglie, meno frequenti"
  - id: olive_verticillium_wilt
    common: "Verticilliosi dell'olivo"
    pathogen_type: fungal
    agent: "Verticillium dahliae"
    hosts: [olea_europaea]
    organs: [leaf, branch]
    symptoms: "Appassimento di un lato della chioma"
    organ_symptoms:
      leaf: "Ingiallimento e disseccamento di un lato della chioma"
      branch: "Imbrunimento dei vasi nei rami alla sezione trasversale"
  - id: olive_armillaria_root_rot
    common: "Marciume radicale dell'olivo (Armillaria)"
    pathogen_type: fungal
    agent: "Armillaria mellea"
    hosts: [olea_europaea]
    organs: [root, trunk]
    symptoms: "Marciume radicale, micelio sotto la corteccia"
    organ_symptoms:
      root: "Radici marce con micelio bianco a ventaglio sotto la corteccia"
      trunk: "Cordoni miceliari neri alla base del tronco, chioma che ingiallisce"
  - id: olive_fruit_fly_damage
    common: "Danno da mosca dell'olivo"
    pathogen_type: insect_induced
    agent: "Bactrocera oleae"
    hosts: [olea_europaea]
    organs: [fruit]
    symptoms: "Punture e gallerie larvali nei frutti, cascola"
    organ_symptoms:
      fruit: "Punture di ovideposizione, gallerie larvali, cascola precoce"

  # ===== FRUMENTO E MAIS =====
  - id: wheat_leaf_rust
    common: "Ruggine bruna del frumento"
    pathogen_type: fungal
    agent: "Puccinia triticina"
    hosts: [triticum_aestivum, triticum_durum]
    organs: [leaf, stem]
    symptoms: "Pustole arancio-brune rotonde"
    organ_symptoms:
      leaf: "Pustole arancio-brune rotonde sulle foglie"
      stem: "Pustole allungate sul culmo"
  - id: wheat_septoria
    common: "Septoriosi del frumento"
    pathogen_type: fungal
    agent: "Zymoseptoria tritici"
    hosts: [triticum_aestivum, triticum_durum]
    organs: [leaf]
    symptoms: "Macchie striate con picnidi scure"
    organ_symptoms:
      leaf: "Macchie striate giallo-brune con piccoli corpi scuri (picnidi) al centro"
  - id: wheat_powdery_mildew
    common: "Oidio del frumento"
    pathogen_type: fungal
    agent: "Blumeria graminis f.sp. tritici"
    hosts: [triticum_aestivum, triticum_durum]
    organs: [leaf, stem]
    symptoms: "Feltro bianco sulle foglie"
    organ_symptoms:
      leaf: "Feltro bianco-grigio polveroso sulla pagina superiore"
      stem: "Feltro bianco sul culmo nelle fasi avanzate"
  - id: fusarium_head_blight
    common: "Fusariosi della spiga"
    pathogen_type: fungal
    agent: "Fusarium graminearum"
    hosts: [triticum_aestivum, triticum_durum, zea_mays]
    organs: [inflorescence, fruit]
    symptoms: "Spighette sbiancate e picchettatura rosata"
    organ_symptoms:
      inflorescence: "Spighette sbiancate, picchettatura rosata alla base della spiga"
      fruit: "Cariossidi raggrinzite e rosate nelle spighe di mais"
  - id: maize_northern_leaf_blight
    common: "Elmintosporiosi del mais"
    pathogen_type: fungal
    agent: "Exserohilum turcicum"
    hosts: [zea_mays]
    organs: [leaf]
    symptoms: "Lesioni fusiformi grigio-verdi"
    organ_symptoms:
      leaf: "Lesioni fusiformi lunghe grigio-verdi, poi brune, sulle foglie"
  - id: maize_common_rust
    common: "Ruggine comune del mais"
    pathogen_type: fungal
    agent: "Puccinia sorghi"
    hosts: [zea_mays]
    organs: [leaf]
    symptoms: "Pustole rosse-brune su entrambe le pagine"
    organ_symptoms:
      leaf: "Pustole piccole rosse-brune su entrambe le pagine fogliari"

  # ===== MELO, PERO, PESCO, CILIEGIO, KIWI =====
  - id: apple_scab
    common: "Ticchiolatura del melo"
    pathogen_type: fungal
    agent: "Venturia inaequalis"
    hosts: [malus_domestica]
    organs: [leaf, fruit]
    symptoms: "Macchie vellutate verde-oliva"
    organ_symptoms:
      leaf: "Macchie vellutate verde-oliva, poi necrotiche e deformazioni"
      fruit: "Croste scure e rugose sulla buccia, frutti deformati"
  - id: apple_brown_rot
    common: "Monilia del melo"
    pathogen_type: fungal
    agent: "Monilinia laxa"
    hosts: [malus_domestica, pyrus_communis, prunus_persica, prunus_avium]
    organs: [flower, fruit, branch]
    symptoms: "Fiori e frutti imbruniti, muffa a cuscinetti"
    organ_symptoms:
      flower: "Fiori imbruniti e avvizziti, spesso già in fioritura"
      fruit: "Marciume bruno con muffa grigia a cuscinetti concentrici"
      branch: "Cancri gommosi sui rami, con disseccamento"
  - id: pear_fire_blight
    common: "Colpo di fuoco batterico"
    pathogen_type: bacterial
    agent: "Erwinia amylovora"
    hosts: [pyrus_communis, malus_domestica]
    organs: [flower, branch, fruit, trunk]
    symptoms: "Germogli anneriti a pastorale, cancri con essudato"
    organ_symptoms:
      flower: "Fiori anneriti e disseccati"
      branch: "Germogli anneriti e ripiegati a forma di pastorale"
      fruit: "Frutti mummificati anneriti, spesso secchi sulla pianta"
      trunk: "Cancri con essudato lattiginoso, corteccia infossata"
  - id: peach_plum_pox
    common: "Vaiolatura (Sharka)"
    pathogen_type: viral
    agent: "Plum pox virus (PPV)"
