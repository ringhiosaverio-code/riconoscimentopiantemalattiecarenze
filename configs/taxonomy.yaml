# ---------------------------------------------------------------
# 4. INSETTI
# ---------------------------------------------------------------
# role: phytophagous | entomophagous | pollinator | neutral
# role: phytophagous (fitofago dannoso) | entomophagous (utile) | pollinator (utile)
# hosts: colture attaccate; organs: organi colpiti. Elenco dei fitofagi principali: da completare con un entomologo.
insects:
  - id: bactrocera_oleae
    common: Mosca delle olive
    scientific: Bactrocera oleae
    role: phytophagous
    order: Diptera
    family: Tephritidae
    hosts: [olea_europaea]
    organs: [fruit]
  - id: prays_oleae
    common: Tignola dell'olivo
    scientific: Prays oleae
    role: phytophagous
    order: Lepidoptera
    family: Yponomeutidae
    hosts: [olea_europaea]
    organs: [flower, inflorescence, leaf, fruit]
  - id: saissetia_oleae
    common: Cocciniglia nera dell'olivo
    scientific: Saissetia oleae
    role: phytophagous
    order: Hemiptera
    family: Coccidae
    hosts: [olea_europaea]
    organs: [branch, leaf]
  - id: euphyllura_olivina
    common: Psilla dell'olivo
    scientific: Euphyllura olivina
    role: phytophagous
    order: Hemiptera
    family: Aphalaridae
    hosts: [olea_europaea]
    organs: [inflorescence, flower]
  - id: liothrips_oleae
    common: Tripide dell'olivo
    scientific: Liothrips oleae
    role: phytophagous
    order: Thysanoptera
