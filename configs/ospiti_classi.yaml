# Colture ospiti delle classi del lettore delle malattie che nelle foto di addestramento non hanno la coltura
# (iNaturalist, Bugwood, articoli). Servono al filtro "coltura indicata": con la coltura scelta dall'utente
# le malattie che non la colpiscono non vengono proposte. Solo le colture tra quelle del lettore della coltura.
# Fonti: schede EPPO e CABI degli organismi, Disciplinare della Calabria (colture con l'avversità).
# Le classi generiche (sana, disturbo nutrizionale) restano senza colture: valgono per tutte. Le colture
# fuori dal lettore (castagno, bietola, leguminose) si scrivono "altro:...": così non compaiono per le altre.
ospiti:
  bw:alternaria_alternata: [citrus_reticulata, citrus_sinensis, citrus_limon, solanum_lycopersicum, malus_domestica, pyrus_communis, actinidia_chinensis, punica_granatum]
  bw:colletotrichum_lindemuthianum: [altro:leguminose]
  bw:cryphonectria_parasitica: [altro:castagno]
  bw:peronospora_destructor: [allium_cepa_tropea, allium_sativum]
  bw:phytophthora_capsici: [capsicum_annuum, cucurbita_pepo, cucumis_sativus, solanum_lycopersicum, solanum_melongena]
  bw:stemphylium_vesicarium: [pyrus_communis, allium_cepa_tropea, allium_sativum]
  bw:verticillium_dahliae: [olea_europaea, solanum_lycopersicum, solanum_melongena, capsicum_annuum, cynara_cardunculus, fragaria_ananassa, solanum_tuberosum, prunus_persica, prunus_avium, cucurbita_pepo]
  danno:afidi: [citrus_limon, citrus_reticulata, citrus_sinensis, prunus_persica, prunus_domestica, prunus_avium, malus_domestica, pyrus_communis, solanum_lycopersicum, capsicum_annuum, solanum_melongena, cucurbita_pepo, cucumis_sativus, lactuca_sativa, brassica_oleracea_italica, solanum_tuberosum, cynara_cardunculus, fragaria_ananassa, actinidia_chinensis, ficus_carica, punica_granatum, corylus_avellana, olea_europaea]
  danno:carpocapsa_tortrici: [malus_domestica, pyrus_communis, prunus_persica, prunus_domestica, prunus_avium]
  danno:cimici: [solanum_lycopersicum, capsicum_annuum, solanum_melongena, prunus_persica, pyrus_communis, malus_domestica, corylus_avellana, olea_europaea, actinidia_chinensis, prunus_avium, prunus_domestica]
  danno:piralide: [zea_mays, capsicum_annuum, solanum_lycopersicum, solanum_melongena]
  danno:tripidi: [capsicum_annuum, solanum_lycopersicum, solanum_melongena, cucumis_sativus, cucurbita_pepo, lactuca_sativa, allium_cepa_tropea, allium_sativum, fragaria_ananassa, vitis_vinifera, citrus_sinensis, citrus_limon, citrus_reticulata, prunus_persica]
  inat:albugo_candida: [brassica_oleracea_italica]
  inat:botrytis_cinerea: [vitis_vinifera, fragaria_ananassa, solanum_lycopersicum, capsicum_annuum, solanum_melongena, cucurbita_pepo, cucumis_sativus, lactuca_sativa, actinidia_chinensis, prunus_avium, prunus_persica, prunus_domestica, malus_domestica, pyrus_communis, citrus_limon, cynara_cardunculus]
  inat:cercospora_beticola: [altro:bietola]
  inat:cerotelium_fici: [ficus_carica]
  inat:cucumovirus_cmv: [solanum_lycopersicum, capsicum_annuum, solanum_melongena, cucurbita_pepo, cucumis_sativus, lactuca_sativa, cynara_cardunculus]
  inat:emaravirus_fici: [ficus_carica]
  inat:erwinia_amylovora: [pyrus_communis, malus_domestica]
  inat:erysiphe_corylacearum: [corylus_avellana]
