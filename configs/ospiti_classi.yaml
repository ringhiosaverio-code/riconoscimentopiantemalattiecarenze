  inat:erysiphe_pisi: [altro:leguminose]
  inat:gymnosporangium_sabinae: [pyrus_communis]
  inat:peronospora_viciae: [altro:leguminose]
  inat:podosphaera_pannosa: [prunus_persica, prunus_domestica]
  inat:polystigma_rubrum: [prunus_domestica]
  inat:ramularia_grevilleana: [fragaria_ananassa]
  inat:sclerotinia_sclerotiorum: [lactuca_sativa, solanum_lycopersicum, capsicum_annuum, solanum_melongena, cucurbita_pepo, cucumis_sativus, brassica_oleracea_italica, solanum_tuberosum, cynara_cardunculus, actinidia_chinensis]
  inat:uromyces_appendiculatus: [altro:leguminose]
