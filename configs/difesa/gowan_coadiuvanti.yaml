# Coadiuvanti, corroboranti e prodotti per la botte del catalogo Gowan Italia: testo delle pagine
# prodotto (gowanitalia.it, consultate il 2026-11-20) e della scheda di difesa dell'olivo 2026.
# Per le miscele prevale la sezione compatibilità dell'etichetta di ciascun prodotto.
fonte: "Gowan Italia, pagine prodotto e scheda colturale Difesa olivo 2026"
prodotti:
  - nome: "MAGO"
    tipo: "Coadiuvante (bagnante, adesivante, antischiuma, antideriva)"
    registrazione: "17360 del 18/12/2018"
    composizione: "Sorbitan mono oleato etossilato 12% (120 g/L)"
    uso: "Coadiuvante per trattamenti fungicidi e insetticidi; antideriva; abbatte la schiuma nella preparazione. Secondo il produttore è impiegabile in miscela con tutti i fungicidi e insetticidi in commercio e in agricoltura biologica con i prodotti ammessi."
    pagina: "https://gowanitalia.it/agrofarmaco/mago/"
    scheda: "https://gowanitalia.it/wp-content/uploads/2026/03/DIFESA-OLIVO-Scheda-Colturale-2026.pdf"
  - nome: "ANTISCHIUMA PLUS"
    tipo: "Antischiuma per soluzioni"
    composizione: "Antischiuma siliconico in emulsione acquosa 33%"
    uso: "Tutte le colture, 1,5-3 ml/hl: versare insieme allo scioglimento dei prodotti; è più efficace se aggiunto prima che si formi la schiuma. Azione fisica, non interferisce chimicamente con i componenti della miscela."
    pagina: "https://gowanitalia.it/agrofarmaco/antischiuma-plus/"
  - nome: "ZEOLITE GOWAN"
    tipo: "Corroborante, potenziatore delle difese delle piante"
    composizione: "Zeolite cubana 100% (polvere di roccia)"
    uso: "Miscibile con i concimi e con i prodotti per la difesa; sulle colture sensibili provare prima su alcune piante. Su olivo 2-4 kg/ha (scheda di difesa olivo 2026)."
    pagina: "https://gowanitalia.it/agrofarmaco/zeolite-gowan/"
    scheda: "https://gowanitalia.it/wp-content/uploads/2026/03/DIFESA-OLIVO-Scheda-Colturale-2026.pdf"
  - nome: "CLEANER GOWAN"
    tipo: "Detergente per botti e atomizzatori"
    composizione: "Tensioattivi anionici e non ionici 5-15%"
    uso: "Pulizia delle attrezzature dopo il trattamento, alla concentrazione dello 0,5%, dopo aver svuotato e sciacquato la botte."
    pagina: "https://gowanitalia.it/agrofarmaco/cleaner-gowan/"
