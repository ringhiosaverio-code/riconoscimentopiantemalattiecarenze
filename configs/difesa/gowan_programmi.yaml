# Programmi di difesa di Gowan Italia per coltura: "posizionamento ideale" dei prodotti nelle fasi della
# coltura (depliant vite, pomodoro, lattuga, fragola) ed epoca/tipologia dei trattamenti (schede
# colturali di pesco, susino, ciliegio, actinidia, olivo, zucchino, patata, nocciolo).
# Trascritti a vista dai PDF del produttore (2025-2026); servono a mettere in ordine i prodotti per la
# fase scelta. Dosi e limiti restano quelli dell'etichetta (configs/difesa/gowan_italia.json), che prevale.
# fasi: in ordine; "da"/"a" sono i numeri delle fasi (1 = prima), estremi compresi.
# bbch: intervallo indicativo della fase sulla scala BBCH (Meier U., BBCH Monograph, JKI 2018), per
# confrontare la fase scelta con gli stadi BBCH scritti in etichetta.
# avversita: parole chiave per riconoscere l'avversità negli usi registrati (minuscole, espressioni regolari).
# nel_catalogo: false = prodotto del depliant assente dagli usi registrati scaricati (non viene proposto).

fonte: "Gowan Italia, depliant e schede colturali di difesa 2025-2026 (gowanitalia.it)"

bio_gowan:  # prodotti con il marchio "BIO - prodotto consentito in agricoltura biologica" nelle schede Gowan
  - AIRONE LIQUIDO
  - AIRONE PIÙ
  - GRIFON 280 LIQUIDO
  - GRIFON PIÙ
  - CUPRORAM 35 WG NC
  - CUPRORAM 35 WG BLU
  - IPERION
  - ASSORAM ELITE 20 WDG
  - BASIRAM ELITE
  - HATTRICK 30 WG
  - REMEDIER
  - ASTREL WDG
  - IBISCO
  - IBISCO VIT
  - POLYVERSUM
  - MAGO
  - ZEOLITE GOWAN

avversita:  # parole chiave delle avversità dei programmi
  peronospora: "peronospor|plasmopara|phytophthora infestans|bremia|pseudoperonospora"
  oidio: "oidio|mal bianco|erysiphe|uncinula|podosphaera|leveillula|sphaerotheca|golovinomyces"
  botrite: "botrit|botrytis|muffa grigia"
  marciumi_tellurici: "marciume radicale|marciumi radicali|marciume del colletto|colletto|pythium|rhizoctonia|fusarium|armillaria|sclerotinia"
  esca: "esca|phaeomoniella|phaeoacremonium|fomitiporia|petri"
  tignole: "tignol|lobesia|eupoecilia|tortric|eulia|cydia|anarsia|prays"
  cicaline: "cicalin|scaphoideus|empoasca|jacobiasca"
  lepidotteri: "lepidotter|nottu|tignol|piralid|spodoptera|helicoverpa|tuta|phthorimaea|mamestra|autographa|ifantria"
  mosca_bianca: "mosca bianca|aleurod|bemisia|trialeurodes"
  acari: "acar|ragnetto|tetranych|panonych|eriofid"
  tripidi: "tripid|thrips|frankliniella"
  nottue_afidi_cimici: "nottu|afid|cimic|halyomorpha|nezara"
  afidi: "afid|aphis|myzus"
  corineo: "corineo|vaiolatura|coryneum|stigmina|wilsonomyces"
  moniliosi: "monili"
  bolla: "bolla|taphrina"
  batteriosi: "batteri|pseudomonas|xanthomonas|cancro batterico"
  cicloconio: "cicloconio|occhio di pavone|spilocaea|venturia oleagin|fusicladium"
  rogna: "rogna"
  fumaggine: "fumaggin"
  mosca_olivo: "mosca (delle olive|dell'olivo)|bactrocera|dacus"
  cocciniglie: "coccinigli|saissetia"
  alternaria: "alternari"
  ruggine: "ruggin"
  dorifora: "dorifora|leptinotarsa"
  mosca_frutta: "mosca della frutta|mosca delle ciliegie|ceratitis|rhagoletis|drosophila"

