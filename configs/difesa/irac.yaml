# Modo d'azione degli insetticidi e acaricidi del Disciplinare (classificazione IRAC, Mode of Action
# Classification Scheme). Serve alla scheda "come intervenire" dell'app per l'alternanza dei gruppi: due
# trattamenti di seguito con lo stesso gruppo favoriscono la resistenza. Chiave: espressione regolare sul nome
# della sostanza nel Disciplinare (minuscolo). "fisico" = azione meccanica o di contatto senza gruppo IRAC.
gruppi:
  "acetamiprid": ["IRAC 4A", "neonicotinoide, sistemico"]
  "sulfoxaflor": ["IRAC 4C", "sulfoximina, sistemico"]
  "flupyradifuron": ["IRAC 4D", "butenolide, sistemico"]
  "spinosad": ["IRAC 5", "spinosine, contatto e ingestione"]
  "spinetoram": ["IRAC 5", "spinosine, contatto e ingestione"]
  "abamectin": ["IRAC 6", "avermectine, translaminare"]
  "emamectin": ["IRAC 6", "avermectine, ingestione"]
  "milbemectin": ["IRAC 6", "milbemicine, contatto"]
  "pyriproxyfen|piriproxifen": ["IRAC 7C", "regolatore di crescita (giovanoide)"]
  "fenoxycarb|fenoxicarb": ["IRAC 7B", "regolatore di crescita (giovanoide)"]
  "hexythiazox|exitiazox": ["IRAC 10A", "acaricida ovicida-larvicida"]
  "clofentezin": ["IRAC 10A", "acaricida ovicida"]
  "etoxazol": ["IRAC 10B", "acaricida ovicida-larvicida"]
  "bacillus thuringiensis": ["IRAC 11A", "biologico, ingestione (larve di lepidotteri)"]
  "flonicamid": ["IRAC 29", "antinutrizionale, sistemico"]
  "tebufenozide|metossifenozide|methoxyfenozide": ["IRAC 18", "regolatore della muta"]
  "acequinocyl": ["IRAC 20B", "acaricida"]
  "bifenazat": ["IRAC 20D", "acaricida"]
  "pyridaben|piridaben|fenpiroxim|fempiroxim|tebufenpyrad|tebufenpirad": ["IRAC 21A", "METI, contatto"]
  "indoxacarb": ["IRAC 22A", "ingestione e contatto"]
  "spirotetramat": ["IRAC 23", "inibitore della sintesi dei lipidi, sistemico"]
  "spirodiclofen": ["IRAC 23", "acaricida, inibitore della sintesi dei lipidi"]
  "cyantraniliprol|ciantraniliprol": ["IRAC 28", "diammide, sistemico"]
  "chlorantraniliprol|clorantraniliprol": ["IRAC 28", "diammide, ingestione"]
  "deltametrin|lambda-?cial|lamb?dacial|etofenprox|tau-?fluvalinat|cipermetrin|zeta-?cipermetrin|beta-?ciflutrin|esfenvalerat|teflutrin": ["IRAC 3A", "piretroide, contatto"]
  "piretrin": ["IRAC 3A", "piretro naturale, contatto (poco persistente)"]
  "fosmet|clorpirifos": ["IRAC 1B", "organofosforico"]
  "pirimicarb": ["IRAC 1A", "carbammato, aficida"]
  "azad[ai]ract": ["IRAC UN", "estratto di neem, antinutrizionale e regolatore di crescita"]
  "beauveria|metarhizium|isaria|paecilomyces|lecanicillium": ["IRAC UNF", "fungo entomopatogeno (biologico)"]
  "olio minerale|olio paraffinico|sali potassici|maltodestrin|caolin|zeolit|olio essenziale|sapone": ["fisico", "azione meccanica o di contatto, nessun rischio di resistenza"]
  "zolfo": ["fisico", "contatto (acaricida, fungicida)"]
