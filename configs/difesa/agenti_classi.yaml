# Agente (nome scientifico) delle classi del lettore delle malattie che non lo hanno già nel nome
# italiano o nella scheda della tassonomia. Serve a collegare la diagnosi alle norme di difesa
# (Disciplinare Calabria) e agli usi registrati dei prodotti. Solo agenti certi per la classe.
