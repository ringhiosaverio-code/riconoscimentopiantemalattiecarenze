# Caratteristiche dei prodotti Gowan lette nelle etichette (o, dove manca l'etichetta, nella pagina prodotto):
# gruppo di resistenza (FRAC per i fungicidi, IRAC per insetticidi e acaricidi), tipo di azione e avvertenze
# per le api. Ogni voce riporta la frase letterale da cui viene ("citazioni"): tests/test_consigli.py
# (test_citazioni_delle_etichette, con PLANTCARE_ETICHETTE=<cartella>) controlla che ogni frase sia nel testo scaricato.
# codici_fonte: etichetta = codice scritto in etichetta; pagina = pagina prodotto Gowan;
#   disciplinare = Allegato 4 del Disciplinare Calabria 2026 (classificazione FRAC e IRAC dei meccanismi d'azione),
#   quando l'etichetta non scrive il codice.
# azione: parole chiave usate per ordinare i prodotti (preventiva, curativa, eradicante, bloccante, sistemica,
#   locosistemica, citotropica, translaminare, penetrante, contatto, copertura, elicitore, antagonista,
#   ingestione, abbattente, persistente, ovicida, larvicida, adulticida, selettivo).

