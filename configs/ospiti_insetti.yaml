# Piante ospiti degli insetti e acari legati a poche colture (classi del lettore degli insetti -> colture del
# lettore della coltura). Serve al controllo di coerenza nell'app: se l'insetto è riconosciuto con sicurezza e
# il lettore della coltura propone una pianta che non lo ospita, l'app lo segnala (la coltura è probabilmente
# sbagliata). Gli insetti polifagi (afidi generici, cocciniglie polifaghe, nottue, ragnetto rosso...) non
# compaiono: possono stare su quasi tutte le colture. Fonti: schede EPPO, Disciplinare della Calabria.
